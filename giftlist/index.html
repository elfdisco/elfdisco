<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Gift lists · elfdisco</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<meta name="theme-color" content="#8d3350"/>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://lypbillwjaeghfpjrgnt.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- LIGHT (rose smoke) ---------- */
  :root{
    --ink:#2b2420; --soft:#796f66; --card:#fffdfb; --line:#e7ddd3;
    --claret:#8d3350; --claret-deep:#6f2640; --gold:#c89a4e; --teal:#2f6f63;
    --page:radial-gradient(90% 60% at 50% -10%,#f2e7ea 0%,rgba(242,231,234,0) 62%),linear-gradient(180deg,#ece7e8 0%,#e3dde0 100%);
    --bar:rgba(255,255,255,.72); --coin-ring:rgba(255,255,255,.35);
    --sh:0 3px 10px rgba(80,50,40,.07); --sh-h:0 12px 24px rgba(80,50,40,.13);
    --taken:rgba(255,255,255,.5); --btn-ink:#fff; --chip-ink:#fff;
    --head:var(--claret-deep); --field:#fff; --field-line:#d9cdc2;
  }
  /* ---------- DARK (ash) ---------- */
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --ink:#f0eef0; --soft:#9b9aa3; --card:#2d2e36; --line:#3c3d47;
    --claret:#d06580; --claret-deep:#b84e6a; --gold:#e3bd74; --teal:#59a99a;
    --page:radial-gradient(100% 62% at 80% -16%,#2e2f38 0%,rgba(46,47,56,0) 62%),linear-gradient(180deg,#26272e 0%,#1e1f25 100%);
    --bar:rgba(30,31,37,.72); --coin-ring:rgba(255,255,255,.2);
    --sh:0 3px 14px rgba(0,0,0,.45); --sh-h:0 16px 34px rgba(0,0,0,.6);
    --taken:rgba(255,255,255,.05); --btn-ink:#fff4f6; --chip-ink:#06231d;
    --head:var(--claret); --field:#24252c; --field-line:#44454f;
  }}
  html[data-theme="dark"]{
    --ink:#f0eef0; --soft:#9b9aa3; --card:#2d2e36; --line:#3c3d47;
    --claret:#d06580; --claret-deep:#b84e6a; --gold:#e3bd74; --teal:#59a99a;
    --page:radial-gradient(100% 62% at 80% -16%,#2e2f38 0%,rgba(46,47,56,0) 62%),linear-gradient(180deg,#26272e 0%,#1e1f25 100%);
    --bar:rgba(30,31,37,.72); --coin-ring:rgba(255,255,255,.2);
    --sh:0 3px 14px rgba(0,0,0,.45); --sh-h:0 16px 34px rgba(0,0,0,.6);
    --taken:rgba(255,255,255,.05); --btn-ink:#fff4f6; --chip-ink:#06231d;
    --head:var(--claret); --field:#24252c; --field-line:#44454f;
  }

  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:"Inter",system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:1.55;min-height:100vh;background:var(--page);background-attachment:fixed;overflow-x:hidden}
  .card .ti{overflow-wrap:anywhere}
  a{color:var(--claret)}
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bar);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .topbar .brand{font-family:"Fraunces";font-weight:600;color:var(--claret-deep);text-decoration:none;font-size:1.05rem}
  .topbar .sp{flex:1}
  .topbar .who{color:var(--soft);font-size:.86rem}
  .iconbtn{background:none;border:1px solid var(--line);border-radius:9px;color:var(--soft);cursor:pointer;padding:6px 8px;font-size:.85rem;font-weight:600;font-family:inherit;display:inline-flex;align-items:center;justify-content:center}
  .iconbtn svg,.grip svg{display:block}
  .grouplabel svg{vertical-align:-2px}
  .iconbtn:hover{color:var(--ink)}
  .wrap{max-width:720px;margin:0 auto;padding:34px 22px 90px}

  .kicker{text-align:center;letter-spacing:.3em;text-transform:uppercase;font-size:.72rem;color:var(--claret);font-weight:600}
  h1.title{font-family:"Fraunces",serif;font-weight:600;text-align:center;font-size:clamp(2.4rem,7vw,3.6rem);margin:.1em 0 .04em;color:var(--head);letter-spacing:-.01em}
  .sub{text-align:center;font-family:"Fraunces";font-style:italic;color:var(--soft);font-size:1.15rem;margin:0 0 18px}
  .rule{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 22px;color:var(--gold)}
  .rule::before,.rule::after{content:"";height:2px;width:70px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .guide{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:center;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 20px;max-width:540px;margin:0 auto 16px;background:var(--card)}
  .guide .gl{font-family:"Fraunces";font-style:italic;color:var(--claret)}
  .guide .gi{display:inline-flex;align-items:center;gap:7px;color:var(--soft);font-size:.9rem;white-space:nowrap}
  .coins{display:inline-flex}
  .coin{width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#f5e0a6,var(--gold) 62%,#9a7430);box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),inset 0 0 0 2px rgba(122,90,34,.3),0 1px 2px rgba(0,0,0,.3);display:inline-flex;align-items:center;justify-content:center}
  .coin::before{content:"£";font-family:Georgia,"Times New Roman",serif;font-style:normal;font-weight:700;font-size:10.5px;color:#6b4a16;line-height:1}
  .coin:not(:first-child){margin-left:-7px}
  .hint{color:var(--soft);font-size:.92rem;max-width:520px;margin:0 auto 26px;border-left:3px solid var(--teal);padding-left:12px}
  .notice{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:10px 14px;margin:0 auto 22px;max-width:560px;color:var(--soft);font-size:.9rem}

  .sec{margin:0 0 26px}
  .sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .sec-h h2{font-family:"Fraunces";font-weight:600;font-size:1.55rem;margin:0;color:var(--head)}
  .sec-h .n{font-size:.8rem;color:var(--gold);font-weight:700}
  .sec-h .ln{flex:1;height:1px;background:var(--line)}
  .sec-h .hidden-tag{font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--soft);border:1px solid var(--line);border-radius:5px;padding:2px 6px}

  .card{position:relative;display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px 14px 19px;margin-bottom:10px;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--claret);border-radius:13px 0 0 13px}
  .itemwrap.dragging{opacity:.4}
  .dropzone{min-height:10px}
  .group{position:relative;margin:2px 0 12px;padding-left:20px}
  .group::before{content:"";position:absolute;left:3px;top:7px;bottom:13px;width:3px;border-radius:3px;background:var(--gold);opacity:.85}
  .group.dragging{opacity:.4}
  .grouphead{display:flex;align-items:center;gap:7px;margin-bottom:6px}
  .grouplabel{font-size:.68rem;letter-spacing:.1em;font-weight:700;color:var(--gold)}
  .grouplabel.editable{cursor:pointer;border-bottom:1px dashed rgba(200,154,78,.55);padding-bottom:1px}
  .groupzone{min-height:6px}
  .card .price{flex:0 0 auto;width:50px;padding-top:3px}
  .card .b{flex:1 1 auto;min-width:0}
  .card .ti{font-family:"Fraunces";font-size:1.22rem;font-weight:600;line-height:1.2;color:var(--ink)}
  .card .ti a{color:var(--claret);text-decoration:underline;text-decoration-style:dotted;text-decoration-thickness:1.5px;text-underline-offset:3px}
  .card .ti a:hover{text-decoration-style:solid}
  .card .ti a .ex{text-decoration:none}
  .card .nt{color:var(--soft);font-size:.92rem;margin-top:3px;white-space:pre-line;overflow-wrap:anywhere}
  .card .nt[contenteditable]{white-space:pre-wrap}
  .nlink{color:var(--claret);font-weight:600;text-decoration:underline;text-decoration-style:dotted;text-decoration-thickness:1.5px;text-underline-offset:3px}
  .nlink:hover{text-decoration-style:solid}
  .nlink .ex{font-size:.75rem;margin-left:2px}
  /* people */
  .forppl{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;background:none;border:none;padding:0;font:inherit;text-align:left}
  button.forppl{cursor:pointer;border-radius:999px}
  button.forppl:hover .pchip{border-color:var(--soft)}
  .pchip{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 3px;background:var(--field)}
  .pav{width:19px;height:19px;border-radius:50%;background:var(--pc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:700;line-height:1;flex:0 0 auto}
  .pchip .pav+.pav{margin-left:-9px;box-shadow:0 0 0 2px var(--field)}
  .pfilter{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:0 auto 24px;max-width:640px}
  .pfilter .gl{font-family:"Fraunces";font-style:italic;color:var(--claret);margin-right:4px;width:100%;text-align:center}
  .pfilter button{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.87rem;font-weight:600;color:var(--soft);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 13px 5px 6px;cursor:pointer}
  .pfilter button.all{padding-left:13px}
  .pfilter button.on{color:var(--ink);border-color:var(--claret);box-shadow:inset 0 0 0 1px var(--claret)}
  .lhint{font-weight:400;color:var(--soft);opacity:.85;margin-left:6px}
  .pchoose{display:flex;flex-wrap:wrap;gap:6px}
  label.pchk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 5px;margin:0;font-size:.86rem;color:var(--ink);cursor:pointer}
  label.pchk input{width:auto;margin:0}
  label.pchk:has(input:checked){border-color:var(--claret);box-shadow:inset 0 0 0 1px var(--claret)}
  .prow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .prow .pcol{width:30px;height:30px;border-radius:50%;background:var(--pc);border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer;flex:0 0 auto;padding:0}
  .prow .pemo{width:64px;text-align:center;padding:8px 6px}
  .prow .pname{flex:1;padding:8px 10px}
  .cbx{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--soft);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff}
  .cbx.on{background:var(--claret);border-color:var(--claret)}
  .pmfoot{font-size:.76rem;color:var(--soft);padding:6px 9px 4px;max-width:240px}
  .actlist{display:flex;flex-direction:column;gap:2px;margin-top:10px}
  .actlist button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;border-radius:10px;padding:11px 10px;font:inherit;font-size:.95rem;color:var(--ink);cursor:pointer}
  .actlist button:hover,.actlist button:active{background:var(--field)}
  .actlist button.active{color:var(--claret);font-weight:600}
  .actlist svg{color:var(--soft);flex:0 0 auto}
  /* phones & tablets: no hover, so one labelled Options button instead of a row of unlabelled icons */
  .ib.ib-more{display:none}
  @media (hover:none){
    [data-tip]:hover::after{display:none}
    .iconrow .ib{display:none}
    .iconrow .ib.ib-more{display:inline-flex;width:auto;padding:0 12px;gap:7px;font:600 .82rem Inter,system-ui,sans-serif;color:var(--soft);height:32px}
  }
  .card .ex{font-size:.8rem;color:var(--claret);margin-left:4px}
  .itemwarn{display:inline-flex;align-items:center;gap:6px;margin:8px 6px 0 0;font-size:.82rem;line-height:1.35;border-radius:8px;padding:4px 10px;border:1px solid}
  .itemwarn.amber{color:#b88a3f;background:rgba(200,154,78,.15);border-color:rgba(200,154,78,.42)}
  .itemwarn.green{color:#4f9e6a;background:rgba(79,158,106,.15);border-color:rgba(79,158,106,.42)}
  .itemwarn.blue{color:#5183bf;background:rgba(81,131,191,.15);border-color:rgba(81,131,191,.42)}
  .itemwarn.red{color:#c05a4e;background:rgba(192,90,78,.15);border-color:rgba(192,90,78,.42)}
  .itemwarn svg{flex:0 0 auto}
  .card.taken{opacity:.72}
  .card.taken .ti{text-decoration:line-through;text-decoration-color:var(--soft)}
  .grip{cursor:grab;color:var(--soft);font-size:1.1rem;align-self:center;padding:0 2px;user-select:none}
  .actions{display:flex;flex-direction:column;gap:6px;align-self:center}
  .get{font-family:inherit;font-weight:600;font-size:.88rem;background:var(--claret);color:var(--btn-ink);border:none;border-radius:9px;padding:9px 14px;cursor:pointer;white-space:nowrap}
  .get:hover{background:var(--claret-deep)}
  .get.ghost{background:none;color:var(--claret);border:1px solid var(--line)}
  .chip{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;background:var(--teal);color:var(--chip-ink);border-radius:6px;padding:3px 8px;white-space:nowrap}
  .claimer{color:var(--soft);font-size:.86rem;margin-top:4px}
  .subitems{margin:-2px 0 12px 30px;position:relative}
  .subitems::before{content:"";position:absolute;left:-14px;top:0;bottom:12px;width:2px;background:var(--line);border-radius:2px}
  .card.subitem{padding:11px 14px 11px 16px}
  .card.subitem .ti{font-size:1.05rem}
  .card.subitem::before{width:4px}
  .itemedit{margin-top:8px;display:flex;gap:8px}
  .mini{font-family:inherit;font-size:.75rem;font-weight:600;color:var(--soft);background:none;border:1px solid var(--line);border-radius:7px;padding:4px 9px;cursor:pointer}
  .mini:hover{color:var(--ink)}
  /* owner shortcut icons under each item */
  .iconrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
  .ib{position:relative;display:inline-flex;align-items:center;justify-content:center;width:30px;height:28px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--soft);cursor:pointer;padding:0}
  .ib:hover{color:var(--ink);border-color:var(--soft)}
  .ib.on{color:var(--gold);border-color:rgba(200,154,78,.55)}
  /* quick tooltips (title="" is slow and easy to miss) */
  [data-tip]{position:relative}
  [data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--card);font:600 .72rem/1.2 Inter,system-ui,sans-serif;padding:5px 8px;border-radius:6px;pointer-events:none;z-index:40;box-shadow:0 4px 12px rgba(0,0,0,.25)}
  /* inline editing (owner, edit mode) */
  .card .tt[contenteditable],.card .nt[contenteditable]{outline:none;border-radius:4px;cursor:text}
  .card .tt[contenteditable]:hover,.card .nt[contenteditable]:hover{box-shadow:0 0 0 1px var(--line)}
  .card .tt[contenteditable]:focus,.card .nt[contenteditable]:focus{box-shadow:0 0 0 2px var(--claret);background:var(--field)}
  .card .nt[contenteditable]:empty::before{content:"add a note…";opacity:.4;font-style:italic}
  .card .price.editable{cursor:pointer;border-radius:7px;padding:3px 4px;margin:-3px -4px}
  .card .price.editable:hover{box-shadow:0 0 0 1px var(--line)}
  /* small anchored menus (price, move to section) */
  .popmenu{position:absolute;z-index:55;min-width:190px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.3)}
  .popmenu .ph{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--soft);padding:6px 9px 4px}
  .popmenu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;border-radius:8px;padding:8px 9px;font:inherit;font-size:.9rem;color:var(--ink);cursor:pointer}
  .popmenu button:hover{background:var(--field)}
  .popmenu button.active{color:var(--claret);font-weight:600}
  /* item picker (link with…) */
  .picker{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}
  .picker .pg{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--soft);padding:9px 12px 4px;background:var(--card);position:sticky;top:0}
  .picker button{display:block;width:100%;text-align:left;background:none;border:none;border-top:1px solid var(--line);padding:9px 12px;font:inherit;font-size:.92rem;color:var(--ink);cursor:pointer}
  .picker button:hover{background:var(--field)}
  .picker button.cur{color:var(--claret);font-weight:600}
  .picker button .d1{padding-left:18px;color:var(--soft)}
  /* warnings editor */
  .wrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .swatches{display:flex;gap:4px;flex:0 0 auto}
  .sw{width:26px;height:26px;border-radius:7px;border:2px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
  .sw.amber{background:rgba(200,154,78,.22);color:#b88a3f} .sw.green{background:rgba(79,158,106,.22);color:#4f9e6a}
  .sw.blue{background:rgba(81,131,191,.22);color:#5183bf} .sw.red{background:rgba(192,90,78,.22);color:#c05a4e}
  .sw.sel{border-color:currentColor}
  .wrow input{flex:1;padding:8px 10px}
  /* tidier item editor */
  .modal.wide{max-width:540px}
  .fgroup{border-top:1px solid var(--line);margin-top:16px;padding-top:4px}
  .fgroup > .fh{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold);margin:10px 0 2px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .two label{margin-top:10px}
  .check{display:flex;align-items:center;gap:9px;margin:12px 0 4px;font-size:.9rem;color:var(--ink);font-weight:500;cursor:pointer}
  .check input{width:auto;margin:0}
  /* archived items section */
  .card.isarchived{opacity:.62}
  .archtoggle{background:none;border:none;color:var(--soft);cursor:pointer;display:inline-flex;align-items:center;padding:2px;transition:transform .2s}
  .archtoggle.collapsed{transform:rotate(-90deg)}
  .archnote{font-size:.82rem;color:var(--soft);margin:-4px 0 12px}
  .taken-chip{background:var(--soft);color:var(--card)}
  .hiddenbadge{font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--card);background:var(--soft);border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:middle}
  .card.ishidden{opacity:.6}

  .btn{font-family:inherit;font-weight:600;font-size:.92rem;background:var(--claret);color:var(--btn-ink);border:none;border-radius:10px;padding:11px 18px;cursor:pointer}
  .btn:hover{background:var(--claret-deep)}
  .btn.ghost{background:none;color:var(--claret);border:1px solid var(--line)}
  .btn.wide{display:block;width:100%;margin-top:10px}
  .btn.sm{padding:7px 12px;font-size:.84rem;border-radius:9px}
  .btn.danger{background:#a23; }
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .center{text-align:center}

  label{display:block;font-size:.82rem;color:var(--soft);margin:12px 0 4px;font-weight:600}
  input,textarea,select{width:100%;font-family:inherit;font-size:1rem;color:var(--ink);background:var(--field);border:1px solid var(--field-line);border-radius:9px;padding:10px 12px}
  textarea{resize:vertical;min-height:62px}
  .err{color:#c0392b;font-size:.86rem;margin-top:8px}
  .muted{color:var(--soft)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:420px;margin:30px auto;box-shadow:var(--sh)}
  .panel h2{font-family:"Fraunces";color:var(--head);margin:.1em 0 .3em}

  .editbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 auto 22px;max-width:620px}
  .listcard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh)}
  .listcard .b{flex:1;min-width:0}
  .listcard .lt{font-family:"Fraunces";font-weight:600;font-size:1.15rem;color:var(--ink)}
  .listcard.arch{opacity:.6}

  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(20,15,18,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
  .modal h3{font-family:"Fraunces";color:var(--head);margin:0 0 6px}
  .modal .x{float:right;cursor:pointer;color:var(--soft);border:none;background:none;font-size:1.3rem}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--claret-deep);color:#fff;padding:11px 18px;border-radius:10px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:.92rem}
  .spin{display:flex;flex-direction:column;align-items:center;gap:15px;padding:90px 0;color:var(--soft);font-family:"Fraunces";font-style:italic;font-size:1.05rem}
  .spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--claret);animation:gspin .8s linear infinite}
  @keyframes gspin{to{transform:rotate(360deg)}}
  @media (max-width:560px){
    .wrap{padding:24px 14px 80px}
    h1.title{font-size:2.3rem}
    /* guests: text full width, then coins (left) + button (right) on one footer row */
    .wrap:not(.editing) .card{flex-wrap:wrap;align-items:center;justify-content:space-between;column-gap:12px;row-gap:9px;padding:13px 14px}
    .wrap:not(.editing) .card .b{order:0;flex:1 1 100%}
    .wrap:not(.editing) .card .price{order:2;width:auto;flex:0 0 auto;padding-top:0}
    .wrap:not(.editing) .card .actions{order:3;flex:0 0 auto;flex-direction:row}
    /* owner editing: no claim button, so keep the coins column and save the extra row */
    .wrap.editing .card{gap:10px;padding:13px 12px 13px 14px}
    .wrap.editing .card .price{width:auto;min-width:30px}
    .wrap.editing .card .actions:empty{display:none}
    .guide{flex-direction:column;align-items:flex-start;gap:8px;padding:12px 16px}
    .topbar{padding:10px 12px}
    .topbar .brand{font-size:.95rem}
  }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  // ---------- config (publishable key is public-safe) ----------
  const SUPABASE_URL = "https://lypbillwjaeghfpjrgnt.supabase.co";
  const SUPABASE_KEY = "sb_publishable_E8x3dkAa6ewCg78hkrYT0w_S8K7mvb1";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ---------- per-browser claim identity ----------
  const ME_KEY = "elfdisco.giftlist.me";
  let me = localStorage.getItem(ME_KEY);
  if(!me){ me = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)); localStorage.setItem(ME_KEY, me); }
  const nameMemo = ()=> localStorage.getItem("elfdisco.giftlist.name") || "";
  const rememberName = n => localStorage.setItem("elfdisco.giftlist.name", n);

  // ---------- small helpers ----------
  const $ = sel => document.querySelector(sel);
  const app = $("#app");
  const LOADING = '<div class="spin"><div class="spinner"></div><span>one moment…</span></div>';
  // plain-text contenteditable where supported, so pasted formatting doesn't leak in
  const CE = (()=>{ try{ const d=document.createElement("div"); d.contentEditable="plaintext-only"; return d.contentEditable==="plaintext-only"?"plaintext-only":"true"; }catch(_){ return "true"; } })();
  const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const coinsHTML = n => n>0 ? '<span class="coins">'+Array.from({length:n}).map(()=>'<i class="coin"></i>').join('')+'</span>' : '<span style="color:var(--gold)">—</span>';
  const slugify = s => (s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40) || "list";
  function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
  // Supabase queries are lazy: they only run once awaited/then'd. Every background save goes through here.
  const save = (q, okMsg) => q.then(({error})=>{ if(error){ console.error(error); toast("Couldn't save: "+error.message); } else if(okMsg) toast(okMsg); });
  const byPos = (a,b)=>a.position-b.position;
  const WARN_STYLES = {
    amber:{label:"Caution",   icon:"warn"},
    green:{label:"Positive",  icon:"check"},
    blue: {label:"Info",      icon:"info"},
    red:  {label:"Important", icon:"alert"},
  };
  function warningHTML(w){
    if(!w || !w.text) return "";
    const st = WARN_STYLES[w.style] ? w.style : "amber";
    return `<div class="itemwarn ${st}">${ICON[WARN_STYLES[st].icon]}<span>${esc(w.text)}</span></div>`;
  }
  // notes: keep line breaks, turn web addresses and [label](url) into links
  function richNote(t){
    t = t||"";
    const re=/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)|((?:https?:\/\/|www\.)[^\s<>"]+)/g;
    let out="", last=0, m;
    while((m=re.exec(t))){
      out+=esc(t.slice(last,m.index));
      if(m[1]){ out+=`<a class="nlink" href="${esc(m[2])}" target="_blank" rel="noopener">${esc(m[1])}<span class="ex">↗</span></a>`; last=re.lastIndex; continue; }
      let u=m[3], trail="";
      while(/[.,;:!?'"\]]$/.test(u) || (u.endsWith(")") && (u.split("(").length < u.split(")").length))){ trail=u.slice(-1)+trail; u=u.slice(0,-1); }
      const href = /^www\./i.test(u) ? "https://"+u : u;
      let label=u; try{ label=new URL(href).hostname.replace(/^www\./,""); }catch(_){}
      out+=`<a class="nlink" href="${esc(href)}" target="_blank" rel="noopener">${esc(label)}<span class="ex">↗</span></a>`+esc(trail);
      last=m.index+m[0].length;
    }
    return out+esc(t.slice(last));
  }
  // people a list is for
  const PEOPLE_COLORS=["#c2577a","#3f8f84","#5b6fc4","#c48a3a","#6f9a4e","#8a5bb0","#4f8fb5","#b5654f"];
  const personAv = p => `<span class="pav" style="--pc:${esc(p.color||PEOPLE_COLORS[0])}">${esc(p.emoji ? p.emoji : ([...(p.name||"?").trim()][0]||"?").toUpperCase())}</span>`;
  const listPeople = () => (state.list && Array.isArray(state.list.people)) ? state.list.people : [];
  function effPeople(i){   // sub-items inherit their parent's people unless they have their own
    let cur=i, n=0;
    while(cur && n<12){ if(Array.isArray(cur.for_people) && cur.for_people.length) return cur.for_people;
      cur = cur.parent_id ? state.items.find(x=>x.id===cur.parent_id) : null; n++; }
    return [];
  }
  function pfOK(i){        // passes the guest's "show presents for" filter (itself or any sub-item)
    const pf=state.pfilter; if(!pf) return true;
    if(effPeople(i).includes(pf)) return true;
    return state.items.some(c=>c.parent_id===i.id && !c.archived && pfOK(c));
  }
  function peopleChipsHTML(i, ed){
    const ppl=listPeople(); if(!ppl.length) return "";
    const own=(i.for_people||[]).map(id=>ppl.find(p=>p.id===id)).filter(Boolean);
    if(!own.length) return "";
    const inner = (own.length===ppl.length && ppl.length>1)
      ? `<span class="pchip">${own.map(personAv).join("")}<span>Everyone</span></span>`
      : own.map(p=>`<span class="pchip">${personAv(p)}<span>${esc(p.name)}</span></span>`).join("");
    return ed ? `<button class="forppl" data-people="${i.id}" data-tip="Who's it for?">${inner}</button>` : `<div class="forppl">${inner}</div>`;
  }
  const isTouch = () => !!(window.matchMedia && matchMedia("(hover: none)").matches);
  const _timers={}; const debounced=(k,fn,ms)=>{ clearTimeout(_timers[k]); _timers[k]=setTimeout(fn, ms||900); };

  // ---------- inline SVG icons (emoji don't render reliably everywhere) ----------
  const _svg=(inner,o)=>{o=o||{};return `<svg width="${o.w||15}" height="${o.w||15}" viewBox="0 0 24 24" fill="${o.fill||'none'}" stroke="${o.sw===0?'none':'currentColor'}" stroke-width="${o.sw==null?2:o.sw}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;};
  const ICON={
    eye:_svg('<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>'),
    eyeoff:_svg('<path d="M17.9 17.9A10 10 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5-5.9M9.9 4.2A9 9 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2"/><line x1="1" y1="1" x2="23" y2="23"/>'),
    warn:_svg('<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12" y2="17.01"/>'),
    trash:_svg('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>'),
    pencil:_svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',{w:13}),
    grip:_svg('<circle cx="9" cy="5" r="1.5"/><circle cx="15" cy="5" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="15" cy="19" r="1.5"/>',{fill:'currentColor',sw:0,w:16}),
    contrast:_svg('<circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18z" fill="currentColor" stroke="none"/>',{w:16}),
    check:_svg('<circle cx="12" cy="12" r="9"/><path d="M8.3 12.5l2.5 2.5 4.7-5.2"/>'),
    info:_svg('<circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16.5"/><line x1="12" y1="7.5" x2="12" y2="7.51"/>'),
    move:_svg('<polyline points="9 6 12 3 15 6"/><polyline points="9 18 12 21 15 18"/><polyline points="6 9 3 12 6 15"/><polyline points="18 9 21 12 18 15"/><line x1="12" y1="3" x2="12" y2="21"/><line x1="3" y1="12" x2="21" y2="12"/>'),
    link:_svg('<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>'),
    plus:_svg('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'),
    archive:_svg('<polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/>'),
    restore:_svg('<polyline points="1 4 1 10 7 10"/><path d="M3.5 15a9 9 0 1 0 2.1-9.4L1 10"/>'),
    alert:_svg('<circle cx="12" cy="12" r="9"/><line x1="12" y1="7.5" x2="12" y2="13"/><line x1="12" y1="16.5" x2="12" y2="16.51"/>'),
    sub:_svg('<polyline points="9 10 4 15 9 20"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/>',{w:15}),
    folder:_svg('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="12 11 15 14 12 17"/><line x1="8" y1="14" x2="15" y2="14"/>'),
    chevron:_svg('<polyline points="6 9 12 15 18 9"/>',{w:16}),
    x:_svg('<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>',{w:14}),
    person:_svg('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),
    dots:_svg('<circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/>',{fill:'currentColor',sw:0}),
    tick:_svg('<polyline points="5 12.5 10 17 19 7"/>',{w:12,sw:3}),
  };

  let session=null, profile=null, state={};

  // ---------- theme toggle (auto by default) ----------
  $("#themeBtn").innerHTML = ICON.contrast;
  $("#themeBtn").onclick = ()=>{
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur==="auto" ? "light" : cur==="light" ? "dark" : "auto";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("elfdisco.giftlist.theme", next);
  };
  { const saved = localStorage.getItem("elfdisco.giftlist.theme"); if(saved) document.documentElement.setAttribute("data-theme", saved); }

  // ===================================================================
  //  DATA LAYER
  // ===================================================================
  async function resolveList(username, slug){
    const { data: list } = await sb.from("lists")
      .select("*, profiles!inner(id,username,display_name), sections(*), tiers(*), items(*)")
      .eq("slug", slug).eq("profiles.username", username).maybeSingle();
    if(list){
      const sort = a => (a||[]).slice().sort((x,y)=>x.position-y.position);
      return { owner:list.profiles, list, sections:sort(list.sections), tiers:sort(list.tiers), items:sort(list.items) };
    }
    // no matching list — real person (show their lists) or nobody?
    const { data: owner } = await sb.from("profiles").select("*").eq("username", username).maybeSingle();
    return owner ? { owner, list:null } : null;
  }
  const loadClaims = async listId => (await sb.from("claims").select("*").eq("list_id", listId)).data || [];
  const myLists = async uid => (await sb.from("lists").select("*").eq("owner_id", uid).order("created_at")).data || [];

  async function seedList(listId){
    await sb.from("tiers").insert([
      {list_id:listId, coins:1, hint:"under £50",  position:0},
      {list_id:listId, coins:2, hint:"£50–100",     position:1},
      {list_id:listId, coins:3, hint:"£100+",       position:2},
    ]);
    await sb.from("sections").insert([
      {list_id:listId, title:"This year's wishes", position:0, visible:true},
      {list_id:listId, title:"Dream big",          position:1, visible:true},
    ]);
  }

  // ===================================================================
  //  AUTH
  // ===================================================================
  async function ensureProfile(){
    if(!session){ profile=null; return; }
    const { data } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
    profile = data || null;
  }
  function renderAuthBtn(){
    const b=$("#authBtn"), who=$("#who");
    if(session){ b.textContent="Sign out"; b.onclick=async()=>{ await sb.auth.signOut(); location.hash="#/"; };
      who.textContent = profile ? ("@"+profile.username) : session.user.email;
    } else { b.textContent="Owner sign in"; b.onclick=()=>{ location.hash="#/signin"; }; who.textContent=""; }
  }

  // ===================================================================
  //  ROUTER
  // ===================================================================
  function parseHash(){
    let h = location.hash.replace(/^#\/?/,"");
    const parts = h.split("/").filter(Boolean).map(decodeURIComponent);
    if(parts.length===0) return {view:"home"};
    if(parts[0]==="signin") return {view:"signin"};
    if(parts[0]==="setup")  return {view:"setup"};
    if(parts.length>=2) return {view:"list", username:parts[0], slug:parts[1]};
    if(parts.length===1) return {view:"user", username:parts[0]};
    return {view:"home"};
  }
  async function route(){
    const r = parseHash();
    app.innerHTML=LOADING;
    try{
      if(r.view==="signin") return renderSignin();
      if(r.view==="setup")  return renderSetup();
      if(r.view==="home")   return session ? (profile?renderDashboard():renderSetup()) : renderLanding();
      if(r.view==="list")   return renderList(r.username, r.slug);
      if(r.view==="user")   return renderUser(r.username);
    }catch(e){ console.error(e); app.innerHTML='<div class="panel center">Something went wrong.<br><span class="muted">'+esc(e.message||e)+'</span></div>'; }
  }

  // ===================================================================
  //  VIEWS — public / auth
  // ===================================================================
  function renderLanding(){
    app.innerHTML = `
      <div class="wrap">
        <div class="kicker">elfdisco</div>
        <h1 class="title">Gift lists</h1>
        <div class="sub">make a list, share a link, nobody doubles up</div>
        <div class="rule"></div>
        <div class="panel center">
          <p class="muted">Signed-out visitors open a list from its share link. If this is your list, sign in to build and edit it.</p>
          <button class="btn wide" onclick="location.hash='#/signin'">Owner sign in / sign up</button>
        </div>
      </div>`;
  }

  // ---------- a person's live (non-archived) lists ----------
  async function renderUserLists(owner, note){
    const { data: lists } = await sb.from("lists").select("slug,title,subtitle")
      .eq("owner_id", owner.id).eq("is_archived", false).order("created_at");
    const rows = (lists||[]).map(l=>`
      <div class="listcard">
        <div class="b"><div class="lt">${esc(l.title)}</div>
        ${l.subtitle?`<div class="muted" style="font-size:.84rem">${esc(l.subtitle)}</div>`:""}</div>
        <button class="btn sm" onclick="location.hash='#/${esc(owner.username)}/${esc(l.slug)}'">Open</button>
      </div>`).join("") || '<p class="muted center">No live lists right now.</p>';
    app.innerHTML = `<div class="wrap">
      <div class="kicker">a gift list</div>
      <h1 class="title">${esc(owner.display_name)}</h1>
      <div class="rule"></div>
      ${note||""}
      ${rows}
    </div>`;
  }
  async function renderUser(username){
    const { data: owner } = await sb.from("profiles").select("*").eq("username", username).maybeSingle();
    if(!owner){ app.innerHTML='<div class="panel center"><h2>Not found</h2><p class="muted">No such person.</p></div>'; return; }
    renderUserLists(owner);
  }

  function renderSignin(){
    if(session){ location.hash="#/"; return; }
    app.innerHTML = `
      <div class="panel">
        <h2>Owner sign in</h2>
        <p class="muted" style="font-size:.9rem">Only list owners need an account. Guests just open your link.</p>
        <label>Email</label><input id="em" type="email" autocomplete="email"/>
        <label>Password</label><input id="pw" type="password" autocomplete="current-password"/>
        <div class="err" id="er"></div>
        <button class="btn wide" id="go">Sign in</button>
        <button class="btn ghost wide" id="su">Create an account instead</button>
      </div>`;
    $("#go").onclick = async()=>{
      $("#er").textContent="Signing in…";
      const email=$("#em").value.trim(), password=$("#pw").value;
      const { error } = await sb.auth.signInWithPassword({email,password});
      if(error){ $("#er").textContent=error.message; }
      else { location.hash="#/"; }
    };
    $("#su").onclick = ()=> renderSignup();
  }

  function renderSignup(){
    app.innerHTML = `
      <div class="panel">
        <h2>Create your account</h2>
        <label>Your name (shown as the list owner)</label><input id="dn" autocomplete="name"/>
        <label>Username (used in your link: /giftlist/<b>you</b>/…)</label><input id="un"/>
        <label>Email</label><input id="em" type="email" autocomplete="email"/>
        <label>Password (8+ characters)</label><input id="pw" type="password" autocomplete="new-password"/>
        <div class="err" id="er"></div>
        <button class="btn wide" id="go">Create account</button>
        <button class="btn ghost wide" id="bk">Back to sign in</button>
      </div>`;
    $("#bk").onclick = renderSignin;
    $("#go").onclick = async()=>{
      $("#er").textContent="";
      const display=$("#dn").value.trim(), username=slugify($("#un").value||$("#dn").value), email=$("#em").value.trim(), password=$("#pw").value;
      if(!display||!username||!email||password.length<8){ $("#er").textContent="Fill everything in; password needs 8+ characters."; return; }
      // remember desired profile until the session is ready
      localStorage.setItem("elfdisco.giftlist.pending", JSON.stringify({username, display}));
      const { data, error } = await sb.auth.signUp({email,password});
      if(error){ $("#er").textContent=error.message; return; }
      if(!data.session){ app.innerHTML=`<div class="panel center"><h2>Check your email</h2><p class="muted">Confirm your address, then come back and sign in.</p></div>`; }
      // if a session is returned (email confirmation off), onAuthStateChange handles the rest
    };
  }

  function renderSetup(){
    const pend = JSON.parse(localStorage.getItem("elfdisco.giftlist.pending")||"null");
    app.innerHTML = `
      <div class="panel">
        <h2>Pick your username</h2>
        <p class="muted" style="font-size:.9rem">This goes in your list links: /giftlist/<b>username</b>/…</p>
        <label>Your name</label><input id="dn" value="${esc(pend?pend.display:(session?session.user.email.split('@')[0]:''))}"/>
        <label>Username</label><input id="un" value="${esc(pend?pend.username:'')}"/>
        <div class="err" id="er"></div>
        <button class="btn wide" id="go">Save</button>
      </div>`;
    $("#go").onclick = async()=>{
      $("#er").textContent="";

      if(!display_name||!username){ $("#er").textContent="Name and username required."; return; }
      const { error } = await sb.from("profiles").insert({id:session.user.id, username, display_name});
      if(error){ $("#er").textContent = error.message.includes("duplicate")?"That username is taken.":error.message; return; }
      localStorage.removeItem("elfdisco.giftlist.pending");
      await ensureProfile(); renderAuthBtn(); location.hash="#/";
    };
  }

  // ===================================================================
  //  VIEW — dashboard (your lists)
  // ===================================================================
  async function renderDashboard(){
    const lists = await myLists(session.user.id);
    const live = lists.filter(l=>!l.is_archived);
    const arch = lists.filter(l=>l.is_archived);
    const card = l=>`
      <div class="listcard ${l.is_archived?'arch':''}">
        <div class="b">
          <div class="lt">${esc(l.title)}</div>
          ${l.subtitle?`<div class="muted" style="font-size:.84rem">${esc(l.subtitle)}</div>`:""}
        </div>
        <button class="btn sm" onclick="location.hash='#/${esc(profile.username)}/${esc(l.slug)}'">Open</button>
        <button class="btn ghost sm" data-copy="${esc(profile.username)}/${esc(l.slug)}">Copy link</button>
        <button class="btn ghost sm" data-dup="${l.id}">Duplicate</button>
        <button class="btn ghost sm" data-arch="${l.id}" data-on="${l.is_archived?1:0}">${l.is_archived?'Unarchive':'Archive'}</button>
      </div>`;
    const liveHTML = live.length ? live.map(card).join("") : '<p class="muted center">No live lists yet — make one below.</p>';
    const archHTML = arch.length
      ? `<div class="sec-h" style="margin-top:36px"><h2>Archived</h2><span class="ln"></span></div>`+arch.map(card).join("")
      : "";
    app.innerHTML = `
      <div class="wrap">
        <div class="kicker">your lists</div>
        <h1 class="title">Hello, ${esc(profile.display_name)}</h1>

        ${liveHTML}
        <button class="btn wide" id="new">+ New list</button>

    app.querySelectorAll("[data-copy]").forEach(b=> b.onclick=()=>{

    });
    app.querySelectorAll("[data-dup]").forEach(b=> b.onclick=()=>duplicateList(b.dataset.dup));

  function newListModal(){
    modal(`
      <h3>New gift list</h3>
      <label>Title</label><input id="t" placeholder="e.g. Ed's Christmas list"/>
      <label>Subtitle (optional)</label><input id="s" placeholder="for Christmas & birthdays"/>
      <label>Link name</label><input id="g" placeholder="christmas"/>

  async function duplicateList(id){
    toast("Duplicating…");
    const { data: src, error: e0 } = await sb.from("lists").select("*, sections(*), tiers(*), items(*)").eq("id", id).maybeSingle();
    if(e0 || !src){ toast("Couldn't read that list."); return; }
    const base = src.slug.replace(/-\d{4}(-\d+)?$/,"") + "-" + new Date().getFullYear();
    const used = new Set((await myLists(session.user.id)).map(l=>l.slug));
    let slug=base, n=2; while(used.has(slug)) slug=base+"-"+(n++);
    const { data: nl, error } = await sb.from("lists").insert({ owner_id:session.user.id, slug, title:src.title, subtitle:src.subtitle,
      item_warning:src.item_warning, show_archived:src.show_archived, people:src.people||[], theme_light:src.theme_light, theme_dark:src.theme_dark }).select().maybeSingle();
    if(error){ toast(error.message); return; }
    const uid=()=> crypto.randomUUID ? crypto.randomUUID() : ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^Math.random()*16>>c/4).toString(16));
    const secMap={}, itemMap={}, grpMap={};
    const sections=(src.sections||[]).map(x=>{ const nid=uid(); secMap[x.id]=nid;
      return { id:nid, list_id:nl.id, title:x.title, sub:x.sub, visible:x.visible, position:x.position, warnings:x.warnings||[] }; });
    (src.items||[]).forEach(i=> itemMap[i.id]=uid());
    const rows=(src.items||[]).filter(i=>secMap[i.section_id]).map(i=>{
      if(i.link_group && !grpMap[i.link_group]) grpMap[i.link_group]=uid();
      return { id:itemMap[i.id], list_id:nl.id, section_id:secMap[i.section_id], parent_id:i.parent_id?(itemMap[i.parent_id]||null):null,
        title:i.title, url:i.url, note:i.note, coins:i.coins, position:i.position, archived:i.archived, hidden:i.hidden,
        taken:i.taken, taken_note:i.taken_note, warnings:i.warnings||[], for_people:i.for_people||[],
        link_group:i.link_group?grpMap[i.link_group]:null, link_label:i.link_label };
    });
    const depthOf=r=>{ let d=0, cur=r; while(cur && cur.parent_id && d<20){ cur=rows.find(x=>x.id===cur.parent_id); d++; } return d; };
    const levels=[]; rows.forEach(r=>{ const d=depthOf(r); (levels[d]=levels[d]||[]).push(r); });   // parents before sub-items
    let err=null;
    const tiers=(src.tiers||[]).map(t=>({ list_id:nl.id, coins:t.coins, hint:t.hint, position:t.position }));
    if(tiers.length) err=(await sb.from("tiers").insert(tiers)).error;
    if(!err && sections.length) err=(await sb.from("sections").insert(sections)).error;
    for(const lvl of levels){ if(err) break; if(lvl && lvl.length) err=(await sb.from("items").insert(lvl)).error; }
    toast(err ? "Copy incomplete: "+err.message : "Duplicated. Claims start fresh; set a password again if you use one.");
    renderDashboard();
  }
  async function toggleArchive(id, on){
    await sb.from("lists").update({is_archived:!on}).eq("id", id);
    renderDashboard();
  }

  // ===================================================================
  //  VIEW — a list (guest viewer + owner editor)
  // ===================================================================
  async function renderList(username, slug){
    const res = await resolveList(username, slug);
    if(!res || !res.owner){ app.innerHTML='<div class="panel center"><h2>Not found</h2><p class="muted">No such person.</p></div>'; return; }
    if(!res.list){ app.innerHTML='<div class="panel center"><h2>Not found</h2><p class="muted">No such list.</p></div>'; return; }
    state = { ...res, username, slug, editing:false, revealed:false, claims:[], pfilter: sessionStorage.getItem("elfdisco.giftlist.pf."+res.list.id)||null };
    state.isOwner = !!(session && session.user.id===res.owner.id);
    state.editing = state.isOwner;   // owners start in edit mode; "View as guest" switches it off

    // archived list: guests get sent to the owner's live lists instead
    if(res.list.is_archived && !state.isOwner){
      return renderUserLists(res.owner,
        `<div class="notice center">“${esc(res.list.title)}” has been archived by ${esc(res.owner.display_name)}. Here are their current lists:</div>`);
    }

    // password gate for guests
    if(!state.isOwner){
      const { data: hasPw } = await sb.rpc("list_has_password",{p_list_id:res.list.id});
      const okKey = "elfdisco.giftlist.pw."+res.list.id;
      if(hasPw && sessionStorage.getItem(okKey)!=="1"){ return renderPwGate(res.list, okKey); }
    }
    // claims: guests (and non-owners) can read; owner gets none unless they reveal
    state.claims = state.isOwner ? [] : await loadClaims(res.list.id);
    drawList();
  }

  function renderPwGate(list, okKey){
    app.innerHTML = `<div class="panel"><h2>${esc(list.title)}</h2>
      <p class="muted">This list is password protected.</p>
      <label>Password</label><input id="pw" type="password"/>
      <div class="err" id="er"></div>
      <button class="btn wide" id="go">View list</button></div>`;
    $("#go").onclick = async()=>{
      const { data: ok } = await sb.rpc("verify_list_password",{p_list_id:list.id, p_attempt:$("#pw").value});
      if(ok){ sessionStorage.setItem(okKey,"1"); renderList(state.username, state.slug); }
      else $("#er").textContent="Wrong password.";
    };
  }

  function claimFor(itemId){ return state.claims.find(c=>c.item_id===itemId); }

  function drawList(){
    const {list, owner, sections, items, tiers, editing, isOwner} = state;
    const guide = tiers.length ? `<div class="guide"><span class="gl">price guide</span>${tiers.map(t=>`<span class="gi">${coinsHTML(t.coins)} ${esc(t.hint)}</span>`).join("")}</div>` : "";

    // owner edit toolbar
    let bar="";
    if(isOwner){
      bar = `<div class="editbar">
        <button class="btn sm" id="editToggle">${editing?"View as guest":"Edit mode"}</button>
        ${editing?`<button class="btn ghost sm" id="addSec">+ Section</button>
          <button class="btn ghost sm" id="editTiers">Price tiers</button>
          <button class="btn ghost sm" id="listSettings">Settings</button>`:""}
        <button class="btn ghost sm" id="share">Share</button>
        <button class="btn ghost sm" id="reveal">${state.revealed?"Hide claims":"Reveal claims"}</button>
      </div>`;
    }

    // "show presents for" filter (only when the list has people)
    const ppl = Array.isArray(list.people) ? list.people : [];
    if(state.pfilter && !ppl.some(p=>p.id===state.pfilter)) state.pfilter=null;
    const pfBar = ppl.length ? `<div class="pfilter"><span class="gl">show presents for</span>
        <button class="all ${!state.pfilter?'on':''}" data-pf="">Everyone</button>
        ${ppl.map(p=>`<button class="${state.pfilter===p.id?'on':''}" data-pf="${esc(p.id)}">${personAv(p)}${esc(p.name)}</button>`).join("")}
      </div>` : "";

    // build section blocks (claimed / taken items stay in place, greyed)
    const visibleSections = sections.filter(s=> s.visible || isOwner);
    let secHTML = visibleSections.map((s,idx)=>{
      const top = items.filter(i=> i.section_id===s.id && !i.parent_id && !i.archived && (!i.hidden || (isOwner && editing)) && pfOK(i))
                       .sort((a,b)=>a.position-b.position);
      if(state.pfilter && !top.length) return "";
      const cards = buildUnits(top, editing) || (editing?"":'<p class="muted" style="margin:4px 0 14px">—</p>');
      return `<div class="sec" data-sec="${s.id}">
        <div class="sec-h"><span class="n">${String(idx+1).padStart(2,"0")}</span>
          <h2 ${editing?`contenteditable="${CE}" spellcheck="false" data-edit-sec="${s.id}"`:''}>${esc(s.title)}</h2>
          ${!s.visible?'<span class="hidden-tag">on hold</span>':''}
          <span class="ln"></span>
          ${editing?`<button class="iconbtn" data-vis="${s.id}" data-on="${s.visible?1:0}" data-tip="${s.visible?'Visible to guests: click to hide section':'Hidden from guests: click to show'}">${s.visible?ICON.eye:ICON.eyeoff}</button>
            <button class="iconbtn" data-secwarn="${s.id}" data-tip="${(s.warnings&&s.warnings.length)?'Edit section notes':'Add a note to every item here'}" style="${(s.warnings&&s.warnings.length)?'color:var(--gold);border-color:rgba(200,154,78,.55)':''}">${ICON.warn}</button>
            <button class="iconbtn" data-delsec="${s.id}" data-tip="Delete section">${ICON.trash}</button>`:""}
        </div>
        <div class="dropzone" data-zone="${s.id}">${cards}</div>
        ${editing?`<button class="btn ghost sm" data-additem="${s.id}">+ Add item</button>`:""}
      </div>`;
    }).join("");

    // archive compartment: collapsible for everyone; owner can hide it from guests and edit items in it
    const ownerEditing = isOwner && editing;
    const archVisible = items.filter(i=> i.archived && (!i.hidden || ownerEditing) && pfOK(i));
    let archHTML="";
    if(archVisible.length && (ownerEditing || list.show_archived)){
      const collapsed = localStorage.getItem("elfdisco.giftlist.archc."+list.id)==="1";
      const secIdx = id => { const k=sections.findIndex(s=>s.id===id); return k<0?999:k; };
      archVisible.sort((a,b)=> secIdx(a.section_id)-secIdx(b.section_id) || a.position-b.position);
      archHTML = `<div class="sec archsec">
        <div class="sec-h">
          <button class="archtoggle ${collapsed?'collapsed':''}" id="archToggle" aria-label="${collapsed?'Show':'Collapse'} archived items">${ICON.chevron}</button>
          <h2>Archived</h2><span class="n">${archVisible.length}</span>
          ${(ownerEditing && !list.show_archived)?'<span class="hidden-tag">hidden from guests</span>':''}
          <span class="ln"></span>
          ${ownerEditing?`<button class="iconbtn" id="archVis" data-tip="${list.show_archived?'Visible to guests: click to hide':'Hidden from guests: click to show'}">${list.show_archived?ICON.eye:ICON.eyeoff}</button>`:""}
        </div>
        ${collapsed?'':archVisible.map(i=>renderItem(i,0)).join("")}
      </div>`;
    }

    const ownerNote = isOwner ? `<div class="notice">You're viewing <b>your own</b> list. Claims are hidden so your surprise is safe — use <b>Reveal claims</b> only if you really want to peek.</div>` : "";
    const hint = isOwner ? "" : `<div class="hint">Pick something and mark it so nobody doubles up — ${esc(owner.display_name)} can't see what's been taken, so the surprise stays safe.</div>`;

    app.innerHTML = `<div class="wrap${editing?' editing':''}">
      <h1 class="title" ${editing?`contenteditable="${CE}" spellcheck="false" id="editTitle"`:''}>${esc(list.title)}</h1>
      <div class="sub" ${editing?`contenteditable="${CE}" spellcheck="false" id="editSub"`:''}>${esc(list.subtitle||(editing?"add a subtitle…":""))}</div>
      <div class="rule"></div>
      ${list.is_archived?`<div class="notice center">This list is <b>archived</b>. Guests who open its link are sent to your other live lists. Unarchive it in Settings to make it live again.</div>`:""}
      ${bar}
      ${ownerNote}${guide}${hint}${pfBar}
      ${secHTML || (state.pfilter ? `<p class="muted center" style="margin:30px 0">Nothing is tagged for ${esc((ppl.find(p=>p.id===state.pfilter)||{}).name||"them")} yet.</p>` : "")}
      ${archHTML}
    </div>`;

    wireList();
  }

  function buildUnits(top, editing){
    const seen={}; const units=[];
    for(const it of top){
      if(it.link_group){
        if(!seen[it.link_group]){ const g={type:'group',key:it.link_group,items:[],pos:Infinity}; seen[it.link_group]=g; units.push(g); }
        const g=seen[it.link_group]; g.items.push(it); g.pos=Math.min(g.pos,it.position);
      } else units.push({type:'item',key:it.id,pos:it.position,items:[it]});
    }
    units.sort((a,b)=>a.pos-b.pos);
    return units.map(u=>{
      if(u.type==='item' || u.items.length<2) return u.items.map(m=>renderItem(m,0)).join("");
      const members=u.items.slice().sort((a,b)=>a.position-b.position);
      const label=(members.find(x=>x.link_label)||{}).link_label || 'Linked';
      return `<div class="group" data-group="${u.key}">
        <div class="grouphead">${editing?'<span class="grip" data-tip="Drag the whole group">'+ICON.grip+'</span>':''}<span class="grouplabel ${editing?'editable':''}" ${editing?`data-grouplabel="${u.key}" data-tip="Rename group"`:''}>${esc(label)}${editing?' '+ICON.pencil:''}</span></div>
        <div class="groupzone" data-group="${u.key}">${members.map(m=>renderItem(m,0)).join("")}</div>
      </div>`;
    }).join("");
  }

  function renderItem(i, depth){
    const editing=state.editing, isOwner=state.isOwner;
    const ed = isOwner && editing;
    const showClaims = (!isOwner) || state.revealed;
    const claim = showClaims ? claimFor(i.id) : null;
    const taken = i.taken || !!claim;
    const ex = i.url?'<span class="ex">↗ link</span>':'';
    const titleHTML = ed
      ? `<span class="tt" contenteditable="${CE}" spellcheck="false" data-edtitle="${i.id}">${esc(i.title)}</span>${i.url?`<a class="ex" href="${esc(i.url)}" target="_blank" rel="noopener">↗ link</a>`:''}`
      : (i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}${ex}</a>` : esc(i.title));
    const noteHTML = ed
      ? `<div class="nt" contenteditable="${CE}" spellcheck="false" data-ednote="${i.id}">${richNote(i.note||"")}</div>`
      : (i.note?`<div class="nt">${richNote(i.note)}</div>`:"");
    const sec = state.sections.find(s=>s.id===i.section_id);
    const warns=[];
    if(state.list.item_warning) warns.push({style:'amber',text:state.list.item_warning});
    if(sec && Array.isArray(sec.warnings)) warns.push(...sec.warnings);
    if(Array.isArray(i.warnings)) warns.push(...i.warnings);
    const warnLine = warns.map(warningHTML).join("");
    let status="";
    let actions="";
    if(claim){
      const mine = claim.claimer_token===me;
      const label = claim.kind==='bought' ? 'Already bought' : 'Spoken for';
      const chipCls = claim.kind==='bought' ? 'chip' : 'chip taken-chip';
      const who = (isOwner && state.revealed) ? ' by '+esc(claim.claimer_name) : '';  // names only when owner peeks
      status = `<div class="claimer"><span class="${chipCls}">${label}</span>${who}${mine?' · you claimed this':''}</div>`;
      if(!ed){
        if(mine) actions=`<button class="get ghost" data-release="${i.id}">Release</button>`;
        else actions=`<button class="mini" data-manage="${i.id}">I claimed this</button>`;
      }
    } else if(i.taken){
      status=`<div class="claimer"><span class="chip taken-chip">taken</span>${i.taken_note?' '+esc(i.taken_note):''}</div>`;
    } else if(!ed && !i.archived){
      actions=`<button class="get" data-claim="${i.id}">Get this</button>`;
    }
    const kids = state.items.filter(c=>c.parent_id===i.id && !c.archived && (!c.hidden || ed) && pfOK(c)).sort(byPos);
    const kidHTML = kids.length ? `<div class="subitems">${kids.map(c=>renderItem(c,depth+1)).join("")}</div>` : "";
    const hasNotes = Array.isArray(i.warnings) && i.warnings.length>0;
    const iconRow = !ed ? "" : `<div class="iconrow">
      <button class="ib" data-edititem="${i.id}" data-tip="All details">${ICON.pencil}</button>
      ${i.archived?"":`<button class="ib" data-subitem="${i.id}" data-tip="Add a sub-item">${ICON.sub}</button>
      ${depth===0?`<button class="ib ${i.link_group?'on':''}" data-linkitem="${i.id}" data-tip="${i.link_group?'Linked: change or unlink':'Link with another item'}">${ICON.link}</button>`:""}
      <button class="ib" data-moveitem="${i.id}" data-tip="Move to another section">${ICON.folder}</button>`}
      <button class="ib ${hasNotes?'on':''}" data-itemnotes="${i.id}" data-tip="${hasNotes?'Edit notes on this item':'Add a note just for this item'}">${ICON.warn}</button>
      ${listPeople().length?`<button class="ib ${(i.for_people||[]).length?'on':''}" data-people="${i.id}" data-tip="Who's it for?">${ICON.person}</button>`:""}
      <button class="ib ${i.hidden?'on':''}" data-hide="${i.id}" data-on="${i.hidden?1:0}" data-tip="${i.hidden?'Hidden from guests: click to show':'Hide from guests'}">${i.hidden?ICON.eyeoff:ICON.eye}</button>
      ${i.archived
        ? `<button class="ib" data-unarc="${i.id}" data-tip="Restore to the list">${ICON.restore}</button>`
        : `<button class="ib" data-arcitem="${i.id}" data-tip="Move to Archived">${ICON.archive}</button>`}
      <button class="ib ib-more" data-more="${i.id}">${ICON.dots}<span>Options</span></button>
    </div>`;
    const priceAttr = ed ? ` editable" data-price="${i.id}" data-tip="Change price` : '';
    const cardHTML = `<div class="card ${taken?'taken':''} ${i.hidden?'ishidden':''} ${i.archived?'isarchived':''} ${depth>0?'subitem':''}" data-item="${i.id}">
      ${ed&&depth===0&&!i.archived?'<span class="grip" data-tip="Drag to reorder">'+ICON.grip+'</span>':''}
      <div class="price${priceAttr}">${coinsHTML(i.coins||0)}</div>
      <div class="b"><div class="ti">${titleHTML}${i.hidden?' <span class="hiddenbadge">hidden</span>':''}</div>${peopleChipsHTML(i, ed)}${noteHTML}${warnLine}${status}${iconRow}</div>
      <div class="actions">${actions}</div>
    </div>`;
    if(depth===0 && !i.archived) return `<div class="itemwrap" data-item="${i.id}">${cardHTML}${kidHTML}</div>`;
    return cardHTML + kidHTML;
  }
  async function archiveItem(id, on){
    const it=state.items.find(i=>i.id===id); if(!it) return;
    const patch = on ? {archived:true, link_group:null, link_label:null} : {archived:false};  // archiving pulls it out of any linked group
    Object.assign(it, patch); drawList();
    await save(sb.from("items").update(patch).eq("id", id), on?"Moved to Archived":"Restored");
  }
  async function toggleHidden(id, on){
    const it=state.items.find(i=>i.id===id); if(it) it.hidden=!on;   // optimistic
    drawList();
    await save(sb.from("items").update({hidden:!on}).eq("id", id), on?"Visible to guests":"Hidden from guests");
  }

  // ---------- wiring for the list view ----------
  function wireList(){
    const {list, isOwner, editing} = state;
    const byId = s=>app.querySelector(s);
    if(byId("#editToggle")) byId("#editToggle").onclick=()=>{ saveTitleIfNeeded(); state.editing=!state.editing; drawList(); };
    if(byId("#share")) byId("#share").onclick=shareList;
    if(byId("#reveal")) byId("#reveal").onclick=doReveal;
    if(byId("#addSec")) byId("#addSec").onclick=addSection;
    if(byId("#editTiers")) byId("#editTiers").onclick=editTiers;
    if(byId("#listSettings")) byId("#listSettings").onclick=listSettings;

    // claims
    app.querySelectorAll("[data-claim]").forEach(b=> b.onclick=()=>claimModal(b.dataset.claim));
    app.querySelectorAll("[data-release]").forEach(b=> b.onclick=()=>releaseItem(b.dataset.release));
    app.querySelectorAll("[data-manage]").forEach(b=> b.onclick=()=>manageClaimModal(b.dataset.manage));
    app.querySelectorAll("[data-pf]").forEach(b=> b.onclick=()=>{
      state.pfilter=b.dataset.pf||null; sessionStorage.setItem("elfdisco.giftlist.pf."+list.id, state.pfilter||""); drawList(); });
    // archived section: collapse (everyone, remembered per browser) + guest visibility (owner)
    if(byId("#archToggle")) byId("#archToggle").onclick=()=>{
      const k="elfdisco.giftlist.archc."+list.id; localStorage.setItem(k, localStorage.getItem(k)==="1"?"0":"1"); drawList(); };
    if(byId("#archVis")) byId("#archVis").onclick=async()=>{
      list.show_archived=!list.show_archived; drawList();
      await save(sb.from("lists").update({show_archived:list.show_archived}).eq("id", list.id), list.show_archived?"Archived items visible to guests":"Archived items hidden from guests"); };

    if(editing){
      // inline fields: Enter commits (notes: Enter = new line, Ctrl/Cmd+Enter or click away commits)
      app.querySelectorAll("[contenteditable]").forEach(el=> el.addEventListener("keydown",e=>{
        const multi = el.hasAttribute("data-ednote");
        if(e.key==="Enter" && (!multi ? !e.shiftKey : (e.metaKey||e.ctrlKey))){ e.preventDefault(); el.blur(); }
        if(e.key==="Escape"){ e.stopPropagation(); el.blur(); } }));
      // item title / note, edited in place; saved as you type and again when you click away
      const commitTitle=el=>{ const it=state.items.find(x=>x.id===el.dataset.edtitle); if(!it) return;
        const v=el.textContent.trim(); if(!v) return;
        if(v!==it.title){ it.title=v; save(sb.from("items").update({title:v}).eq("id",it.id)); } };
      const commitNote=el=>{ const it=state.items.find(x=>x.id===el.dataset.ednote); if(!it) return;
        const v=(el.innerText||"").replace(/\u00a0/g," ").replace(/\n{3,}/g,"\n\n").trim()||null;

          const r=document.createRange(); r.selectNodeContents(el); r.collapse(false); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); };
        el.oninput=()=>debounced("n"+el.dataset.ednote, ()=>commitNote(el));
        el.onblur=()=>{ clearTimeout(_timers["n"+el.dataset.ednote]); commitNote(el);
          const it=state.items.find(x=>x.id===el.dataset.ednote); el.innerHTML=richNote((it&&it.note)||""); }; });

      app.querySelectorAll("[data-additem]").forEach(b=> b.onclick=()=>itemModal(null, b.dataset.additem));
      app.querySelectorAll("[data-edititem]").forEach(b=> b.onclick=()=>itemModal(b.dataset.edititem));
      app.querySelectorAll("[data-subitem]").forEach(b=> b.onclick=()=>itemModal(null, null, b.dataset.subitem));
      app.querySelectorAll("[data-hide]").forEach(b=> b.onclick=()=>toggleHidden(b.dataset.hide, b.dataset.on==="1"));
      app.querySelectorAll("[data-arcitem]").forEach(b=> b.onclick=()=>archiveItem(b.dataset.arcitem, true));
      app.querySelectorAll("[data-unarc]").forEach(b=> b.onclick=()=>archiveItem(b.dataset.unarc, false));
      app.querySelectorAll("[data-delsec]").forEach(b=> b.onclick=()=>delSection(b.dataset.delsec));

      app.querySelectorAll("[data-grouplabel]").forEach(el=> el.onclick=()=>groupLabelModal(el.dataset.grouplabel));
      app.querySelectorAll("[data-vis]").forEach(b=> b.onclick=()=>toggleSectionVis(b.dataset.vis, b.dataset.on==="1"));

  function saveTitleIfNeeded(){
    const t=app.querySelector("#editTitle"), s=app.querySelector("#editSub");
    if(!t&&!s) return;
    const title=t?t.textContent.trim():state.list.title;
    let sub=s?s.textContent.trim():state.list.subtitle; if(sub==="add a subtitle…") sub="";
    if(title!==state.list.title || sub!==(state.list.subtitle||"")){
      state.list.title=title; state.list.subtitle=sub;                 // update now
      save(sb.from("lists").update({title, subtitle:sub}).eq("id", state.list.id));
    }
  }

  // ---------- drag & drop: live reorder (desktop) ----------
  // Only the grip makes a card draggable, so text inside cards can still be selected and edited.
  let dragKind=null, dragEl=null;
  function wireDnd(){
    app.querySelectorAll(".grip").forEach(g=> g.addEventListener("pointerdown",()=>{
      const host=g.closest(".itemwrap, .group"); if(host) host.setAttribute("draggable","true"); }));
    const undrag=()=> app.querySelectorAll('[draggable="true"]').forEach(x=>x.removeAttribute("draggable"));
    if(!wireDnd.bound){ document.addEventListener("pointerup", ()=>{ if(!dragEl) undrag(); }); wireDnd.bound=true; }
    app.querySelectorAll('.itemwrap').forEach(w=>{
      w.addEventListener("dragstart",e=>{ if(w.getAttribute("draggable")!=="true") return; e.stopPropagation(); dragKind = w.closest('.groupzone')?'member':'unit'; dragEl=w; w.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",w.dataset.item);}catch(_){} });
      w.addEventListener("dragend",()=>{ w.classList.remove("dragging"); dragKind=null; dragEl=null; undrag(); commitOrder(); });
    });
    app.querySelectorAll('.group').forEach(g=>{
      g.addEventListener("dragstart",e=>{ if(g.getAttribute("draggable")!=="true") return; dragKind='unit'; dragEl=g; g.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; });
      g.addEventListener("dragend",()=>{ g.classList.remove("dragging"); dragKind=null; dragEl=null; undrag(); commitOrder(); });
    });
    app.querySelectorAll(".dropzone").forEach(zone=>{
      zone.addEventListener("dragover",e=>{
        if(dragKind!=='unit'||!dragEl) return;
        e.preventDefault();
        const after=dragAfter(zone, e.clientY, ':scope > .itemwrap:not(.dragging), :scope > .group:not(.dragging)');
        if(after==null) zone.appendChild(dragEl); else zone.insertBefore(dragEl, after);
      });
    });
    app.querySelectorAll(".groupzone").forEach(zone=>{
      zone.addEventListener("dragover",e=>{
        if(dragKind!=='member'||!dragEl||dragEl.parentElement!==zone) return;
        e.preventDefault();
        const after=dragAfter(zone, e.clientY, ':scope > .itemwrap:not(.dragging)');
        if(after==null) zone.appendChild(dragEl); else zone.insertBefore(dragEl, after);
      });
    });
  }
  function dragAfter(zone, y, selector){
    const els=[...zone.querySelectorAll(selector)];
    let best={off:-Infinity, el:null};
    for(const c of els){ const b=c.getBoundingClientRect(); const off=y-b.top-b.height/2; if(off<0 && off>best.off) best={off, el:c}; }
    return best.el;
  }
  function commitOrder(){
    const ups=[];
    const assign=(w,secId,kref)=>{ const it=state.items.find(i=>i.id===w.dataset.item); if(it){ if(it.section_id!==secId||it.position!==kref.k){ it.section_id=secId; it.position=kref.k; ups.push(it);} kref.k++; } };
    app.querySelectorAll(".dropzone").forEach(zone=>{
      const secId=zone.dataset.zone; const kref={k:0};
      [...zone.children].forEach(child=>{
        if(child.classList.contains("itemwrap")) assign(child, secId, kref);
        else if(child.classList.contains("group")){ const gz=child.querySelector(".groupzone"); if(gz)[...gz.children].filter(x=>x.classList.contains("itemwrap")).forEach(x=>assign(x,secId,kref)); }
      });
    });
    if(ups.length) Promise.all(ups.map(it=> sb.from("items").update({section_id:it.section_id, position:it.position}).eq("id", it.id)));
    // sub-items follow their parent into a new section
    const kidUps=[];
    ups.forEach(p=> state.items.filter(c=>c.parent_id===p.id && c.section_id!==p.section_id).forEach(c=>{ c.section_id=p.section_id; kidUps.push(c); }));
    if(kidUps.length) Promise.all(kidUps.map(c=> sb.from("items").update({section_id:c.section_id}).eq("id", c.id)));
  }
  async function reloadItems(){
    const { data } = await sb.from("items").select("*").eq("list_id", state.list.id).order("position");
    state.items=data||[]; drawList();
  }

  // ---------- items in the same order as the page, grouped by section ----------
  function orderedItems(){
    const out=[];
    const walk=(it,d,sec)=>{ out.push({it,d,sec}); state.items.filter(c=>c.parent_id===it.id && !c.archived).sort(byPos).forEach(c=>walk(c,d+1,sec)); };
    state.sections.slice().sort(byPos).forEach(sec=>{
      const top=state.items.filter(i=>i.section_id===sec.id && !i.parent_id && !i.archived).sort(byPos);
      const seen={}, units=[];
      top.forEach(it=>{ if(it.link_group){ if(!seen[it.link_group]){ seen[it.link_group]={pos:Infinity,items:[]}; units.push(seen[it.link_group]); }
                          const g=seen[it.link_group]; g.items.push(it); g.pos=Math.min(g.pos,it.position); }
                        else units.push({pos:it.position,items:[it]}); });
      units.sort((a,b)=>a.pos-b.pos).forEach(u=>u.items.forEach(it=>walk(it,0,sec)));
    });
    return out;
  }
  // <select> options with one <optgroup> per section; filter decides which items are offered
  function itemOptions(selectedId, filter, noneLabel){
    let html=`<option value="">${esc(noneLabel)}</option>`, cur=null;
    orderedItems().forEach(({it,d,sec})=>{
      if(!filter(it,d)) return;
      if(cur!==sec.id){ if(cur!==null) html+='</optgroup>'; html+=`<optgroup label="${esc(sec.title)}">`; cur=sec.id; }
      html+=`<option value="${it.id}" ${it.id===selectedId?"selected":""}>${d?"\u00a0\u00a0\u00a0↳ ":""}${esc(it.title)}</option>`;
    });
    return html + (cur!==null?'</optgroup>':'');
  }

  // ---------- coloured notes editor (used for sections and single items) ----------
  function warningsEditorHTML(list){
    const rows=(list&&list.length?list:[]).map(w=>warnRowHTML(w)).join("");
    return `<div class="wlist">${rows}</div><button type="button" class="btn ghost sm" data-addwarn>+ Add a note</button>`;
  }
  function warnRowHTML(w){
    w=w||{style:"amber",text:""};
    const sw=Object.keys(WARN_STYLES).map(k=>`<button type="button" class="sw ${k} ${w.style===k?'sel':''}" data-sw="${k}" data-tip="${WARN_STYLES[k].label}">${ICON[WARN_STYLES[k].icon]}</button>`).join("");
    return `<div class="wrow" data-style="${WARN_STYLES[w.style]?w.style:'amber'}"><div class="swatches">${sw}</div><input value="${esc(w.text||"")}" placeholder="e.g. Great choice, I'd love this"/><button type="button" class="ib" data-delwarn data-tip="Remove">${ICON.x}</button></div>`;

  function wireWarningsEditor(root){
    const bindRow=row=>{
      row.querySelectorAll("[data-sw]").forEach(b=> b.onclick=()=>{ row.dataset.style=b.dataset.sw; row.querySelectorAll(".sw").forEach(x=>x.classList.toggle("sel", x===b)); });
      row.querySelector("[data-delwarn]").onclick=()=>row.remove();
    };
    root.querySelectorAll(".wrow").forEach(bindRow);
    root.querySelector("[data-addwarn]").onclick=()=>{ const t=document.createElement("div"); t.innerHTML=warnRowHTML(); const row=t.firstElementChild;
      root.querySelector(".wlist").appendChild(row); bindRow(row); row.querySelector("input").focus(); };
  }
  const readWarnings = root => [...root.querySelectorAll(".wrow")].map(r=>({style:r.dataset.style, text:r.querySelector("input").value.trim()})).filter(w=>w.text);

  // ---------- small anchored menus ----------
  function closePop(){ const p=document.getElementById("popmenu"); if(p) p.remove(); }
  function newPop(anchor, inner){
    closePop();
    const m=document.createElement("div"); m.className="popmenu"; m.id="popmenu"; m.innerHTML=inner;
    document.body.appendChild(m);
    const r=anchor.getBoundingClientRect();
    const left=Math.min(window.scrollX+r.left, window.scrollX+document.documentElement.clientWidth-m.offsetWidth-10);
    m.style.left=Math.max(10,left)+"px"; m.style.top=(window.scrollY+r.bottom+6)+"px";
    setTimeout(()=> document.addEventListener("click", function off(e){ if(!document.body.contains(m)){ document.removeEventListener("click", off); return; }
      if(!m.contains(e.target)){ closePop(); document.removeEventListener("click", off); } }), 0);
    return m;
  }
  function choiceModal(title, options){
    modal(`<h3>${esc(title)}</h3><div class="actlist">${options.map((o,k)=>`<button data-k="${k}" class="${o.active?'active':''}">${o.html}</button>`).join("")}</div>`, m=>{
      m.querySelectorAll("[data-k]").forEach(b=> b.onclick=()=>{ closeModal(); options[+b.dataset.k].pick(); }); });
  }
  function popMenu(anchor, title, options){
    if(!anchor || !anchor.isConnected || isTouch()) return choiceModal(title, options);
    const m=newPop(anchor, `<div class="ph">${esc(title)}</div>`+options.map((o,k)=>`<button data-k="${k}" class="${o.active?'active':''}">${o.html}</button>`).join(""));
    m.querySelectorAll("button").forEach(b=> b.onclick=()=>{ closePop(); options[+b.dataset.k].pick(); });
  }
  // who an item is for: tick several, saves as you tick
  function peopleMenu(itemId, anchor){
    const it=state.items.find(x=>x.id===itemId); if(!it) return;
    const ppl=listPeople();
    if(!ppl.length){ toast("Add people in Settings first"); return; }
    let host;
    const paint=()=>{
      host.innerHTML = ppl.map(p=>{ const on=(it.for_people||[]).includes(p.id);
          return `<button data-pid="${esc(p.id)}" class="${on?'active':''}"><span class="cbx ${on?'on':''}">${on?ICON.tick:''}</span>${personAv(p)}<span>${esc(p.name)}</span></button>`; }).join("")
        + `<div class="pmfoot">${it.parent_id?"Leave everyone unticked to use the parent item's people.":"Untagged items only show when guests choose “Everyone”."}</div>`;
      host.querySelectorAll("[data-pid]").forEach(b=> b.onclick=async e=>{ e.stopPropagation();
        const cur=new Set(it.for_people||[]); cur.has(b.dataset.pid)?cur.delete(b.dataset.pid):cur.add(b.dataset.pid);
        it.for_people=ppl.map(p=>p.id).filter(x=>cur.has(x)); paint(); drawList();
        await save(sb.from("items").update({for_people:it.for_people}).eq("id",it.id)); });
    };
    if(!anchor || !anchor.isConnected || isTouch()){
      modal(`<h3>Who's “${esc(it.title)}” for?</h3><div class="actlist" id="pmb"></div><button class="btn wide" id="pmdone">Done</button>`, m=>{
        host=m.querySelector("#pmb"); m.querySelector("#pmdone").onclick=closeModal; paint(); });
    } else {
      const m=newPop(anchor, `<div class="ph">Who's it for?</div><div id="pmb"></div>`); host=m.querySelector("#pmb"); paint();
    }
