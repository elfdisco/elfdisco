  // phones: every item action in one labelled list
  function itemActionsSheet(id){
    const it=state.items.find(x=>x.id===id); if(!it) return;
    const acts=[
      {ic:ICON.pencil, label:"All details", go:()=>itemModal(id)},
      ...(it.archived?[]:[{ic:ICON.sub, label:"Add a sub-item", go:()=>itemModal(null,null,id)}]),
      ...(!it.archived && !it.parent_id?[{ic:ICON.link, label:it.link_group?"Change or remove link":"Link with another item", go:()=>linkModal(id)}]:[]),
      ...(it.archived?[]:[{ic:ICON.folder, label:"Move to another section", go:()=>moveMenu(id,null)}]),
      {ic:'<span class="coins"><i class="coin"></i></span>', label:"Change price", go:()=>priceMenu(id,null)},
      ...(listPeople().length?[{ic:ICON.person, label:"Who's it for?", go:()=>peopleMenu(id,null)}]:[]),
      {ic:ICON.warn, label:(it.warnings&&it.warnings.length)?"Edit notes on this item":"Add a note to this item", go:()=>itemNotesModal(id)},
      {ic:it.hidden?ICON.eye:ICON.eyeoff, label:it.hidden?"Show to guests":"Hide from guests", go:()=>toggleHidden(id, !!it.hidden)},
      it.archived ? {ic:ICON.restore, label:"Restore to the list", go:()=>archiveItem(id,false)}
                  : {ic:ICON.archive, label:"Move to Archived", go:()=>archiveItem(id,true)},
    ];
    modal(`<h3>${esc(it.title)}</h3><div class="actlist">${acts.map((a,k)=>`<button data-k="${k}">${a.ic}<span>${esc(a.label)}</span></button>`).join("")}</div>`, m=>{
      m.querySelectorAll("[data-k]").forEach(b=> b.onclick=()=>{ closeModal(); acts[+b.dataset.k].go(); }); });
  }
  function priceMenu(itemId, anchor){
    const it=state.items.find(x=>x.id===itemId); if(!it) return;
    const setCoins=async c=>{ it.coins=c; drawList(); await save(sb.from("items").update({coins:c}).eq("id",it.id)); };
    popMenu(anchor, "Price", [
      ...state.tiers.slice().sort(byPos).map(t=>({ html:`${coinsHTML(t.coins)}<span>${esc(t.hint)}</span>`, active:it.coins===t.coins, pick:()=>setCoins(t.coins) })),
      { html:`<span style="color:var(--gold);width:17px;text-align:center">—</span><span>Not sure / returnable</span>`, active:!it.coins, pick:()=>setCoins(null) },
    ]);
  }
  function moveMenu(itemId, anchor){
    const it=state.items.find(x=>x.id===itemId); if(!it) return;
    popMenu(anchor, "Move to section", state.sections.slice().sort(byPos).map(s=>({
      html:esc(s.title)+(s.id===it.section_id?' <span class="muted" style="margin-left:auto;font-size:.78rem">here</span>':''),
      active:s.id===it.section_id,
      pick:()=>moveToSection(it, s.id),
    })));
  }
  async function moveToSection(it, secId){
    if(it.section_id===secId) return;
    const wasLinked=!!it.link_group;
    const pos=state.items.filter(i=>i.section_id===secId && !i.parent_id && !i.archived).length;
    const patch={section_id:secId, parent_id:null, link_group:null, link_label:null, position:pos};   // lands at the bottom, on its own
    Object.assign(it, patch);
    const kids=state.items.filter(c=>c.parent_id===it.id); kids.forEach(c=>c.section_id=secId);
    drawList();
    await Promise.all([ save(sb.from("items").update(patch).eq("id",it.id)), ...kids.map(c=>save(sb.from("items").update({section_id:secId}).eq("id",c.id))) ]);
    toast(wasLinked?"Moved (and unlinked from its group)":"Moved");
  }

  // ---------- link with another item ----------
  function linkModal(itemId){
    const it=state.items.find(x=>x.id===itemId); if(!it) return;
    const linked=it.link_group ? state.items.filter(x=>x.link_group===it.link_group && x.id!==it.id) : [];
    let rows="", cur=null;
    orderedItems().forEach(({it:o,d,sec})=>{
      if(o.id===it.id || d>0) return;
      if(cur!==sec.id){ rows+=`<div class="pg">${esc(sec.title)}</div>`; cur=sec.id; }
      const isCur = it.link_group && o.link_group===it.link_group;
      rows+=`<button data-pick="${o.id}" class="${isCur?'cur':''}">${esc(o.title)}${isCur?' ✓':''}</button>`;
    });
    modal(`<h3>Link “${esc(it.title)}”</h3>
      <p class="muted" style="font-size:.88rem;margin:0">Linked items sit together in a group you can drag around as one. Each stays separately claimable.</p>
      ${linked.length?`<p style="font-size:.88rem;margin:12px 0 0">Currently linked with: <b>${linked.map(x=>esc(x.title)).join(", ")}</b></p>
        <button class="btn ghost sm" id="unlink" style="margin-top:8px">Unlink this item</button>`:""}
      <label>Link with…</label><div class="picker">${rows||'<p class="muted" style="padding:10px 12px">No other items yet.</p>'}</div>`, m=>{
      m.querySelectorAll("[data-pick]").forEach(b=> b.onclick=async()=>{
        const target=state.items.find(x=>x.id===b.dataset.pick); if(!target) return;
        const grp=it.link_group||target.link_group||(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());
        const label=(state.items.find(x=>x.link_group===grp && x.link_label)||{}).link_label||null;
        const pos=Math.min(it.position, target.section_id===it.section_id?target.position:it.position);
        const patchA={link_group:grp, link_label:label, parent_id:null};
        const patchB={link_group:grp, link_label:label, parent_id:null, section_id:it.section_id, position:pos};
        Object.assign(it,patchA); Object.assign(target,patchB);
        closeModal(); drawList();
        await Promise.all([ save(sb.from("items").update(patchA).eq("id",it.id)), save(sb.from("items").update(patchB).eq("id",target.id)) ]);
      });
      const u=m.querySelector("#unlink");
      if(u) u.onclick=async()=>{
        const grp=it.link_group; Object.assign(it,{link_group:null, link_label:null});
        const rest=state.items.filter(x=>x.link_group===grp);
        const ops=[ save(sb.from("items").update({link_group:null, link_label:null}).eq("id",it.id)) ];
        if(rest.length===1){ Object.assign(rest[0],{link_group:null, link_label:null}); ops.push(save(sb.from("items").update({link_group:null, link_label:null}).eq("id",rest[0].id))); }  // a group of one isn't a group
        closeModal(); drawList(); await Promise.all(ops);
      };
    });
  }

  // ---------- full item editor ----------
  function itemModal(itemId, sectionId, parentId){
    const it = itemId ? state.items.find(i=>i.id===itemId) : null;
    const quickSub = !!(parentId && !it);          // adding a sub-item via the sub-item button
    const curParent = it && it.parent_id ? it.parent_id : (parentId||"");
    const defSec = it ? it.section_id : (parentId ? (state.items.find(x=>x.id===parentId)||{}).section_id : sectionId);
    const secOpts = state.sections.slice().sort(byPos).map(s=>`<option value="${s.id}" ${s.id===defSec?"selected":""}>${esc(s.title)}</option>`).join("");
    const tierOpts = state.tiers.slice().sort(byPos).map(t=>`<option value="${t.coins}" ${it&&it.coins===t.coins?"selected":""}>${"£".repeat(t.coins)}  ${esc(t.hint)}</option>`).join("")
                   + `<option value="" ${it&&!it.coins?"selected":""}>Not sure / returnable</option>`;
    const parentOpts = itemOptions(curParent, (o,d)=> d===0 && (!it || o.id!==it.id), "None (its own item)");
    const parentTitle = quickSub ? (state.items.find(x=>x.id===parentId)||{}).title||"" : "";
    modal(`
      <h3>${it?"Edit item":(quickSub?"Add a sub-item":"Add an item")}</h3>
      ${quickSub?`<p class="muted" style="font-size:.88rem;margin:0">Under <b>${esc(parentTitle)}</b></p>`:""}
      <label>What is it?</label><input id="t" value="${esc(it?it.title:"")}" placeholder="e.g. Merino polo jumper"/>
      <label>Note <span class="lhint">links work here too: paste them in, or name them like [Blue one](https://…)</span></label>
      <textarea id="n" placeholder="Size, colour, why you want it… One option per line works well.">${esc(it&&it.note?it.note:"")}</textarea>
      <div class="two">
        <div><label>Price</label><select id="c">${tierOpts}</select></div>
        <div><label>Title link <span class="lhint">makes the name clickable</span></label><input id="u" value="${esc(it&&it.url?it.url:"")}" placeholder="https://…"/></div>
      </div>
      ${listPeople().length?`<label>Who's it for? <span class="lhint">${(quickSub||(it&&it.parent_id))?"leave blank to match the item above":"tick everyone it's for"}</span></label>
        <div class="pchoose">${listPeople().map(p=>`<label class="pchk"><input type="checkbox" value="${esc(p.id)}" ${it&&(it.for_people||[]).includes(p.id)?'checked':''}/>${personAv(p)}<span>${esc(p.name)}</span></label>`).join("")}</div>`:""}
      ${quickSub?"":`<div class="fgroup"><div class="fh">Where it sits</div>
        <div class="two">
          <div><label>Section</label><select id="s">${secOpts}</select></div>
          <div><label>Sub-item of</label><select id="par">${parentOpts}</select></div>
        </div>
        <p class="muted" style="font-size:.8rem;margin:6px 0 0">To link it with other items, use the link button under the item.</p>
      </div>`}
      <div class="fgroup"><div class="fh">Notes for guests</div>${warningsEditorHTML(it?it.warnings:[])}</div>
      <div class="fgroup"><div class="fh">Status</div>
        <label class="check"><input type="checkbox" id="hd" ${it&&it.hidden?"checked":""}/> Hide from guests (you'll still see it)</label>
        <label class="check"><input type="checkbox" id="tk" ${it&&it.taken?"checked":""}/> Already taken (greyed out for everyone)</label>
        <input id="tn" placeholder="Optional: e.g. Dad's getting this" value="${esc(it&&it.taken_note?it.taken_note:"")}" style="${it&&it.taken?'':'display:none'}"/>
      </div>
      <div class="err" id="er"></div>
      <div class="row" style="margin-top:16px"><button class="btn" id="go">${it?"Save":"Add"}</button>
      ${it?`<button class="btn ghost" id="arc">${it.archived?"Restore":"Archive"}</button><button class="btn ghost" id="del" style="margin-left:auto">Delete</button>`:''}</div>
    `, m=>{
      m.classList.add("wide");
      wireWarningsEditor(m);
      const tk=m.querySelector("#tk"), tn=m.querySelector("#tn");
      tk.onchange=()=>{ tn.style.display=tk.checked?"":"none"; if(tk.checked) tn.focus(); };
      m.querySelector("#t").focus();
      m.querySelector("#go").onclick=async()=>{
        const title=m.querySelector("#t").value.trim(); if(!title){ m.querySelector("#er").textContent="Give it a name."; return; }
        const parVal = quickSub ? (parentId||null) : (m.querySelector("#par").value||null);
        let sec = quickSub ? defSec : m.querySelector("#s").value;
        if(parVal){ const p=state.items.find(x=>x.id===parVal); if(p) sec=p.section_id; }   // a sub-item lives in its parent's section
        const payload={ title, url:m.querySelector("#u").value.trim()||null, note:m.querySelector("#n").value.trim()||null,
          coins:m.querySelector("#c").value?parseInt(m.querySelector("#c").value):null, section_id:sec, parent_id:parVal,
          taken:tk.checked, taken_note:tk.checked?(tn.value.trim()||null):null, hidden:m.querySelector("#hd").checked,
          warnings:readWarnings(m), for_people:[...m.querySelectorAll(".pchoose input:checked")].map(x=>x.value) };
        if(it && (parVal!==it.parent_id || sec!==it.section_id) && it.link_group){ payload.link_group=null; payload.link_label=null; }  // leaving its group
        let error;
        if(it){ ({error}=await sb.from("items").update(payload).eq("id", it.id));
                if(!error && sec!==it.section_id) await Promise.all(state.items.filter(c=>c.parent_id===it.id).map(c=>sb.from("items").update({section_id:sec}).eq("id",c.id))); }
        else { const pos=state.items.filter(i=> parVal ? i.parent_id===parVal : (i.section_id===sec && !i.parent_id)).length;
               ({error}=await sb.from("items").insert({...payload, list_id:state.list.id, position:pos})); }
        if(error){ m.querySelector("#er").textContent=error.message; return; }
        closeModal(); reloadItems();
      };
      if(it){
        m.querySelector("#arc").onclick=async()=>{ closeModal(); await archiveItem(it.id, !it.archived); };
        m.querySelector("#del").onclick=async()=>{ const hasKids=state.items.some(x=>x.parent_id===it.id);
          if(!confirm("Delete this item"+(hasKids?" and its sub-items":"")+"? This can't be undone.")) return;
          await save(sb.from("items").delete().eq("id", it.id)); closeModal(); reloadItems(); };
      }
    });
  }

  // ---------- sections ----------
  async function addSection(){
    const pos=state.sections.length;
    const { data } = await sb.from("sections").insert({list_id:state.list.id, title:"New section", position:pos, visible:true}).select().maybeSingle();
    state.sections.push(data); drawList();
  }
  async function delSection(id){
    const n=state.items.filter(i=>i.section_id===id).length;
    if(!confirm(n?`Delete this section and its ${n} item(s)?`:"Delete this empty section?")) return;
    await sb.from("sections").delete().eq("id", id);
    state.sections=state.sections.filter(s=>s.id!==id); state.items=state.items.filter(i=>i.section_id!==id); drawList();
  }
  async function toggleSectionVis(id, on){
    const s=state.sections.find(x=>x.id===id); if(s) s.visible=!on; drawList();
    await save(sb.from("sections").update({visible:!on}).eq("id", id), on?"Section hidden from guests":"Section visible to guests");
  }
  function groupLabelModal(key){
    const cur=(state.items.find(x=>x.link_group===key && x.link_label)||{}).link_label || "";
    modal(`<h3>Name this group</h3>
      <p class="muted" style="font-size:.9rem">Shown above the linked items. Clear it to go back to “Linked”.</p>
      <label>Group label</label><input id="gl" value="${esc(cur)}" placeholder="e.g. Negroni ingredients"/>
      <button class="btn wide" id="go">Save</button>`, m=>{
      const inp=m.querySelector("#gl"); inp.focus(); inp.select();
      m.querySelector("#go").onclick=async()=>{ const v=inp.value.trim()||null;
        state.items.forEach(it=>{ if(it.link_group===key) it.link_label=v; });
        await sb.from("items").update({link_label:v}).eq("link_group", key);
        closeModal(); drawList(); toast("Group renamed."); };
    });
  }
  function sectionWarnModal(secId){
    const s=state.sections.find(x=>x.id===secId); if(!s) return;
    modal(`<h3>Notes on “${esc(s.title)}”</h3>
      <p class="muted" style="font-size:.88rem">Shown under every item in this section. Add as many as you like and pick a colour for each: caution, positive, info or important.</p>
      ${warningsEditorHTML(s.warnings)}
      <button class="btn wide" id="go">Save</button>`, m=>{
      m.classList.add("wide"); wireWarningsEditor(m);
      m.querySelector("#go").onclick=async()=>{ const w=readWarnings(m); s.warnings=w; s.warning=null; closeModal(); drawList();
        await save(sb.from("sections").update({warnings:w, warning:null}).eq("id", secId), "Saved"); };
    });
  }

  // ---------- tiers ----------
  function editTiers(){
    const rows = state.tiers.map(t=>`<div class="row" data-tier="${t.id}" style="margin-bottom:8px">
      <input style="width:70px" type="number" min="1" max="5" value="${t.coins}" data-f="coins"/>
      <input style="flex:1" value="${esc(t.hint)}" data-f="hint"/>
      <button class="btn ghost sm" data-deltier="${t.id}">✕</button></div>`).join("");
    modal(`<h3>Price tiers</h3><p class="muted" style="font-size:.88rem">Coins = how generous. Shown as the guide at the top.</p>
      <div id="rows">${rows}</div>
      <button class="btn ghost sm" id="addtier">+ Add tier</button>
      <button class="btn wide" id="go">Save tiers</button>`, m=>{
      m.querySelector("#addtier").onclick=()=>{ const d=document.createElement("div"); d.className="row"; d.style.marginBottom="8px";
        d.innerHTML=`<input style="width:70px" type="number" min="1" max="5" value="${(m.querySelectorAll('[data-tier],.row').length)}" data-f="coins"/><input style="flex:1" placeholder="e.g. £100+" data-f="hint"/><button class="btn ghost sm" data-delnew>✕</button>`;
        m.querySelector("#rows").appendChild(d); d.querySelector("[data-delnew]").onclick=()=>d.remove(); };
      m.querySelectorAll("[data-deltier]").forEach(b=> b.onclick=async()=>{ await sb.from("tiers").delete().eq("id",b.dataset.deltier); b.closest(".row").remove(); });
      m.querySelector("#go").onclick=async()=>{
        await sb.from("tiers").delete().eq("list_id", state.list.id);
        const rows=[...m.querySelectorAll("#rows .row")]; const payload=rows.map((r,i)=>({ list_id:state.list.id,
          coins:parseInt(r.querySelector('[data-f=coins]').value)||1, hint:r.querySelector('[data-f=hint]').value.trim()||"—", position:i }));
        if(payload.length) await sb.from("tiers").insert(payload);
        const { data } = await sb.from("tiers").select("*").eq("list_id",state.list.id).order("position"); state.tiers=data||[];
        closeModal(); drawList();
      };
    });
  }

  // ---------- list settings (password / archive) ----------
  function listSettings(){
    const l=state.list;
    const prow = p => `<div class="prow" data-pid="${esc(p.id||"")}"><button type="button" class="pcol" style="--pc:${esc(p.color)}" data-tip="Change colour"></button><input class="pemo" maxlength="4" placeholder="emoji" value="${esc(p.emoji||"")}" aria-label="Optional emoji"/><input class="pname" placeholder="Name" value="${esc(p.name||"")}"/><button type="button" class="ib" data-delp data-tip="Remove">${ICON.x}</button></div>`;
    modal(`<h3>List settings</h3>
      <div class="fgroup" style="border-top:none;margin-top:4px;padding-top:0"><div class="fh">Who the list is for</div>
        <p class="muted" style="font-size:.82rem;margin:4px 0 10px">Optional. Add people if this list covers more than one person, e.g. a family. Then tag each item with who it's for, and guests can filter to one person's presents. Leave empty for a list that's just for you.</p>
        <div id="ppl">${(Array.isArray(l.people)?l.people:[]).map(prow).join("")}</div>
        <div class="row"><button class="btn ghost sm" id="addp">+ Add person</button><button class="btn sm" id="savep">Save people</button></div>
      </div>
      <hr style="border:none;border-top:1px solid var(--line);margin:16px 0"/>
      <label>Link name (the bit after your name in the address)</label>
      <input id="slug" value="${esc(l.slug)}"/>
      <p class="muted" style="font-size:.82rem">Lives at /giftlist/#/${esc(state.owner.username)}/<b>${esc(l.slug)}</b></p>
      <button class="btn sm" id="saveslug">Save link name</button>
      <hr style="border:none;border-top:1px solid var(--line);margin:16px 0"/>
      <label>Password (leave blank for none)</label><input id="pw" type="text" placeholder="set a password"/>
      <p class="muted" style="font-size:.82rem">A light gate for casual snooping — not bank-grade. Clear it to remove.</p>
      <button class="btn sm" id="savepw">Save password</button>
      <hr style="border:none;border-top:1px solid var(--line);margin:16px 0"/>
      <label>Warning note on every item — whole list (optional)</label>
      <input id="warn" value="${esc(l.item_warning||"")}" placeholder="e.g. please check sizes with me first"/>
      <p class="muted" style="font-size:.82rem">Shown under every item in the list. For one section, use the note button on that section's header; for one item, the note button under it.</p>
      <button class="btn sm" id="savewarn">Save note</button>
      <hr style="border:none;border-top:1px solid var(--line);margin:16px 0"/>
      <button class="btn ghost wide" id="arch">${l.is_archived?"Unarchive this list":"Archive this list"}</button>
      <p class="muted" style="font-size:.82rem">Archiving hides it from guests — anyone on its link is sent to your other live lists instead.</p>
      <div class="err" id="er"></div>`, m=>{
      m.classList.add("wide");
      const bindP=row=>{
        row.querySelector(".pcol").onclick=()=>{ const cur=getComputedStyle(row.querySelector(".pcol")).getPropertyValue("--pc").trim();
          const k=PEOPLE_COLORS.indexOf(cur); row.querySelector(".pcol").style.setProperty("--pc", PEOPLE_COLORS[(k+1)%PEOPLE_COLORS.length]); };
        row.querySelector("[data-delp]").onclick=()=>row.remove();
      };
      m.querySelectorAll(".prow").forEach(bindP);
      m.querySelector("#addp").onclick=()=>{ const t=document.createElement("div");
        t.innerHTML=prow({color:PEOPLE_COLORS[m.querySelectorAll(".prow").length % PEOPLE_COLORS.length]});
        const row=t.firstElementChild; m.querySelector("#ppl").appendChild(row); bindP(row); row.querySelector(".pname").focus(); };
      m.querySelector("#savep").onclick=async()=>{
        const next=[...m.querySelectorAll(".prow")].map(r=>({
          id: r.dataset.pid || ("p"+Math.random().toString(36).slice(2,9)),
          name: r.querySelector(".pname").value.trim(),
          emoji: r.querySelector(".pemo").value.trim() || null,
          color: getComputedStyle(r.querySelector(".pcol")).getPropertyValue("--pc").trim() || PEOPLE_COLORS[0],
        })).filter(p=>p.name);
        const keep=new Set(next.map(p=>p.id));
        const { error } = await sb.from("lists").update({people:next}).eq("id", l.id);
        if(error){ m.querySelector("#er").textContent=error.message; return; }
        l.people=next;
        // untag removed people from items
        const fix=state.items.filter(i=>(i.for_people||[]).some(id=>!keep.has(id)));
        fix.forEach(i=> i.for_people=i.for_people.filter(id=>keep.has(id)));
        await Promise.all(fix.map(i=> save(sb.from("items").update({for_people:i.for_people}).eq("id",i.id))));
        m.querySelectorAll(".prow").forEach((r,k)=>{ if(!r.dataset.pid && next[k]) r.dataset.pid=next[k].id; });
        drawList(); toast("People saved");
      };
      m.querySelector("#saveslug").onclick=async()=>{
        const newSlug=slugify(m.querySelector("#slug").value);
        if(!newSlug){ m.querySelector("#er").textContent="Give it a link name."; return; }
        if(newSlug===l.slug){ toast("No change."); return; }
        const { error } = await sb.from("lists").update({slug:newSlug}).eq("id", l.id);
        if(error){ m.querySelector("#er").textContent = /duplicate/.test(error.message)?"You already have a list with that link name.":error.message; return; }
        l.slug=newSlug; state.slug=newSlug; closeModal(); toast("Link name updated.");
        location.hash="#/"+state.owner.username+"/"+newSlug;
      };
      m.querySelector("#savepw").onclick=async()=>{ const { error }=await sb.rpc("set_list_password",{p_list_id:l.id, p_password:m.querySelector("#pw").value});
        m.querySelector("#er").textContent=error?error.message:""; if(!error) toast("Password updated."); };
      m.querySelector("#savewarn").onclick=async()=>{ const v=m.querySelector("#warn").value.trim()||null;
        await sb.from("lists").update({item_warning:v}).eq("id",l.id); l.item_warning=v; closeModal(); drawList(); toast("Saved."); };
      m.querySelector("#arch").onclick=async()=>{ await sb.from("lists").update({is_archived:!l.is_archived}).eq("id",l.id); l.is_archived=!l.is_archived; closeModal(); drawList(); };
    });
  }

  // ---------- share ----------
  async function shareList(){
    const url = location.origin + location.pathname + "#/" + state.owner.username + "/" + state.list.slug;
    const { data: hasPw } = await sb.rpc("list_has_password",{p_list_id:state.list.id});
    let text = `${state.owner.display_name} invited you to their gift list: ${url}`;
    if(hasPw) text += `\n(It's password protected — ask ${state.owner.display_name} for the password.)`;
    try{ await navigator.clipboard.writeText(text); toast("Invite copied to clipboard."); }
    catch(e){ modal(`<h3>Share this link</h3><textarea style="min-height:100px">${esc(text)}</textarea>`); }
  }

  // ---------- reveal ----------
  async function doReveal(){
    if(!state.revealed){
      if(!confirm("This spoils your surprises — you'll see exactly what's been claimed and bought. Are you sure?")) return;
      const { data } = await sb.rpc("reveal_claims",{p_list_id:state.list.id});
      state.claims=data||[]; state.revealed=true;
    } else { state.claims=[]; state.revealed=false; }
    drawList();
  }

  // ---------- claim / release ----------
  function claimModal(itemId){
    const it=state.items.find(i=>i.id===itemId);
    modal(`<h3>Mark this gift</h3>
      <p class="muted">${esc(it.title)}</p>
      <label>Your name</label><input id="nm" value="${esc(nameMemo())}"/>
      <p class="muted" style="font-size:.8rem;margin:4px 0 0">Only so you can un-claim it later — it isn't shown to other guests.</p>
      <div class="err" id="er"></div>
      <div class="row"><button class="btn" id="will">I'll buy this</button>
      <button class="btn ghost" id="bought">Already bought it</button></div>`, m=>{
      const go=async kind=>{ const name=m.querySelector("#nm").value.trim(); if(!name){ m.querySelector("#er").textContent="Pop your name in."; return; }
        rememberName(name);
        const { data: ok, error } = await sb.rpc("claim_item",{p_item_id:itemId, p_token:me, p_name:name, p_kind:kind});
        if(error){ m.querySelector("#er").textContent=error.message; return; }
        closeModal();
        if(ok===false){ toast("Someone just claimed that one."); }
        state.claims = await loadClaims(state.list.id); drawList();
      };
      m.querySelector("#will").onclick=()=>go("claimed");
      m.querySelector("#bought").onclick=()=>go("bought");
    });
  }
  async function releaseItem(itemId, name){
    const { data: ok } = await sb.rpc("release_claim",{p_item_id:itemId, p_token:me, p_name:name||null});
    if(ok===false){ toast(name?"That name doesn't match this claim.":"Only the person who claimed it can release it."); }
    state.claims = await loadClaims(state.list.id); drawList();
  }
  // release from another device by entering the name you claimed with
  function manageClaimModal(itemId){
    const it=state.items.find(i=>i.id===itemId);
    modal(`<h3>Un-claim this gift</h3>
      <p class="muted">${esc(it?it.title:"")}</p>
      <p class="muted" style="font-size:.9rem">Claimed this already (maybe on another device)? Enter the name you used and I'll release it.</p>
      <label>Name you claimed with</label><input id="nm" value="${esc(nameMemo())}"/>
      <div class="err" id="er"></div>
      <button class="btn wide" id="go">Un-claim it</button>`, m=>{
      m.querySelector("#go").onclick=async()=>{ const name=m.querySelector("#nm").value.trim();
        if(!name){ m.querySelector("#er").textContent="Enter the name."; return; }
        closeModal(); await releaseItem(itemId, name); };
    });
  }

  // ---------- modal plumbing ----------
  function modal(html, after){
    closeModal();
    const scrim=document.createElement("div"); scrim.className="scrim"; scrim.id="scrim";
    scrim.innerHTML=`<div class="modal"><button class="x" id="mx">×</button>${html}</div>`;
    document.body.appendChild(scrim);
    scrim.addEventListener("mousedown",e=>{ if(e.target===scrim) closeModal(); });
    scrim.querySelector("#mx").onclick=closeModal;
    if(after) after(scrim.querySelector(".modal"));
  }
  function closeModal(){ const s=$("#scrim"); if(s) s.remove(); }
  window.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeModal(); closePop(); } });

  // ===================================================================
  //  BOOT
  // ===================================================================
  sb.auth.onAuthStateChange(async (_evt, s)=>{
    session=s; await ensureProfile();
    // finish signup profile creation if a session just arrived
    if(session && !profile){
      const pend=JSON.parse(localStorage.getItem("elfdisco.giftlist.pending")||"null");
      if(pend){ const { error }=await sb.from("profiles").insert({id:session.user.id, username:pend.username, display_name:pend.display});
        if(!error){ localStorage.removeItem("elfdisco.giftlist.pending"); await ensureProfile(); } }
    }
    renderAuthBtn();
    const path = location.hash.replace(/^#\/?/,"").split("/")[0];
    if(session && path==="signin"){ location.hash="#/"; return; }
    route();
  });

  (async ()=>{
    const { data } = await sb.auth.getSession();
    session=data.session; await ensureProfile(); renderAuthBtn();
    window.addEventListener("hashchange", route);
    route();
  })();
})();
</script>
</body>
</html>
